<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A2240">
<meta name="description" content="Portal CEL: Recursos do Professor e gestão escolar do Centro Educativo Líder — Visão do Futuro.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Portal CEL</title>
<style>@font-face{font-family:'Lora';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/Lora-Bold.woff) format('woff')}@font-face{font-family:'Figtree';font-weight:300 900;font-style:normal;font-display:swap;src:url(fonts/Figtree.woff) format('woff')}@font-face{font-family:'Plex Mono';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/IBMPlexMono-Regular.woff) format('woff')}@font-face{font-family:'Plex Mono';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/IBMPlexMono-Medium.woff) format('woff')}
/* Conceito: o caderno do professor do CEL — papel quadriculado da escola, marcadores de livro na navegação,
   azul-marinho e dourado do CEL com as cores da bandeira; planos e provas aparecem como folhas A4 sobre a mesa. */
:root {
  --paper: #F2F4F8; --grid: rgba(10, 34, 64, .055); --surface: #FFFFFF; --surface-2: #ECF0F6; --ink: #0F1E36; --ink-2: #46536D; --ink-3: #737F96;
  --line: #D5DCE7; --line-2: #BCC6D6;
  --brand: #0A2240; --brand-2: #163A6A; --brand-ink: #FFFFFF; --brand-ink-2: #B9C6DC;
  --amber: #F2B705; --amber-ink: #2A1F00; --amber-soft: #FFF2C2; --amber-line: #E5C65A;
  --ok: #0F7A45; --ok-soft: #E0F2E7; --danger: #B5122C; --danger-soft: #FBE5E9; --info-soft: #E6EEFB;
  --btn: #0A2240; --btn-ink: #FFFFFF; --btn-hover: #163A6A; --link: #1B4C9A; --focus: #2F6FED;
  --sheet: #FFFFFF; --sheet-ink: #1A2236; --sheet-mute: #5D6676; --sheet-line: #B8C2D3; --sheet-head: #E9EDF4; --sheet-navy: #0A2240; --sheet-gold: #A6791A;
  --f-display: 'Lora', Georgia, 'Times New Roman', serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r: 10px; --r-sm: 6px; --shadow: 0 1px 2px rgba(10, 34, 64, .06), 0 6px 18px rgba(10, 34, 64, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0A111E; --grid: rgba(242, 183, 5, .045); --surface: #111A2B; --surface-2: #172237; --ink: #E6EBF3; --ink-2: #A6B1C6; --ink-3: #7B879E;
    --line: #243049; --line-2: #33415E; --brand: #071830; --brand-2: #10284A; --brand-ink: #FFFFFF; --brand-ink-2: #9FB0CC;
    --amber: #F5C232; --amber-ink: #241A00; --amber-soft: #352A08; --amber-line: #6B5715;
    --ok: #46C985; --ok-soft: #0E2A1C; --danger: #FF6B7F; --danger-soft: #3A1520; --info-soft: #16243F;
    --btn: #F5C232; --btn-ink: #13213A; --btn-hover: #FFD45E; --link: #93B6FF; --focus: #8FB0FF;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0A111E; --grid: rgba(242, 183, 5, .045); --surface: #111A2B; --surface-2: #172237; --ink: #E6EBF3; --ink-2: #A6B1C6; --ink-3: #7B879E;
  --line: #243049; --line-2: #33415E; --brand: #071830; --brand-2: #10284A; --brand-ink: #FFFFFF; --brand-ink-2: #9FB0CC;
  --amber: #F5C232; --amber-ink: #241A00; --amber-soft: #352A08; --amber-line: #6B5715;
  --ok: #46C985; --ok-soft: #0E2A1C; --danger: #FF6B7F; --danger-soft: #3A1520; --info-soft: #16243F;
  --btn: #F5C232; --btn-ink: #13213A; --btn-hover: #FFD45E; --link: #93B6FF; --focus: #8FB0FF;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body {
  margin: 0; background-color: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--brand) }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; letter-spacing: .005em; line-height: 1.15; margin: 0; text-wrap: balance; color: var(--ink) }
p { margin: 0 }
a { color: var(--link) }
button, input, select, textarea { font: inherit; color: inherit }
input:not([type]), input[type=text], input[type=number], input[type=search], input[type=date], select, textarea {
  border: 1px solid var(--line-2); border-radius: var(--r-sm); background-color: var(--surface); color: var(--ink); padding: 6px 9px; min-height: 36px; max-width: 100% }
textarea { line-height: 1.45; resize: vertical }
fieldset input[type=text], fieldset textarea { width: 100% }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 4px }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }

/* ---------- topo */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand); color: var(--brand-ink); border-bottom: 3px solid var(--amber) }
.top-in { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.top img { height: 44px; width: auto; display: block }
.brand { display: flex; flex-direction: column; min-width: 0 }
.brand b { font-family: var(--f-display); font-size: 21px; font-weight: 700; letter-spacing: .005em; line-height: 1.05; color: var(--brand-ink) }
.brand span { font-size: 12.5px; color: var(--brand-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.mode { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--brand-ink-2); border: 1px solid rgba(255, 255, 255, .18); border-radius: 999px; padding: 5px 11px; white-space: nowrap }
.mode i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-ink-2) }
.mode .s { display: none }
@media (max-width: 560px) { .mode .l { display: none } .mode .s { display: inline } .top img { height: 38px } .brand b { font-size: 20px } }
.mode[data-mode="cloud"] i { background: #46C985 } .mode[data-mode="local"] i { background: var(--amber) } .mode[data-mode="wait"] i { animation: pulse 1.2s infinite }
@keyframes pulse { 50% { opacity: .3 } }

/* ---------- quadro (navegação) */
.layout { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 24px; padding-block: 22px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px); align-self: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; box-shadow: var(--shadow) }
.nav-label { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px 6px }
.nav button { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: var(--r-sm); text-align: left; cursor: pointer; color: var(--ink-2); font-weight: 500 }
.nav button:hover { background: var(--surface-2); color: var(--ink) }
.nav button[aria-current="page"] { background: var(--surface-2); color: var(--ink); font-weight: 700 }
.mark { flex: none; width: 10px; height: 22px; background: var(--line-2); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 74%, 0 100%); transition: background .18s, transform .18s }
.nav button[aria-current="page"] .mark { background: var(--amber); transform: translateY(-2px) }
.nav-foot { border-top: 1px dashed var(--line); margin-top: 6px; padding: 9px 10px 4px; font-size: 12px; color: var(--ink-3) }
/* Portal CEL: a passagem para a gestão escolar */
.nav-amb { display: flex; align-items: center; gap: 10px; margin-top: 6px; padding: 10px; border-top: 1px dashed var(--line); color: var(--ink-2); text-decoration: none; border-radius: 0 0 var(--r-sm) var(--r-sm) }
.nav-amb:hover { background: var(--surface-2); color: var(--ink) }
.nav-amb svg { flex: none; width: 20px; height: 20px; color: var(--amber) }
.nav-amb span { display: flex; flex-direction: column; line-height: 1.25; min-width: 0 }
.nav-amb b { font-weight: 600; font-size: 14px }
.nav-amb small { font-size: 11.5px; color: var(--ink-3) }
.nav-amb + .nav-foot { margin-top: 0 }
.nav-amb + .nav-amb { margin-top: 0; border-top: 0 }
.nav-amb:has(+ .nav-amb) { border-radius: 0 }
@media (max-width: 920px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-block: 12px 48px }
  .nav { position: static; display: flex; gap: 4px; overflow-x: auto; padding: 6px; scrollbar-width: thin }
  .nav button { width: auto; white-space: nowrap; padding: 8px 10px }
  .nav-label, .nav-foot { display: none }
  .nav-amb { flex: none; margin: 0 0 0 4px; padding: 8px 12px; border-top: 0; border-left: 1px dashed var(--line); border-radius: 0; white-space: nowrap; gap: 7px }
  .nav-amb small { display: none }
  .nav-amb + .nav-amb { margin-left: 0 }
  .nav-amb svg { width: 18px; height: 18px }
  .brand span { display: none }
}
main { min-width: 0 }
main:focus { outline: none }

/* ---------- blocos comuns */
.view { display: flex; flex-direction: column; gap: 18px; min-width: 0 }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 18px }
.head h1 { font-size: clamp(26px, 3.2vw, 34px) }
.head p { color: var(--ink-2); max-width: 70ch }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0 }
.card h2 { font-size: 21px; margin-bottom: 10px }
.card h3 { font-size: 17px; margin-bottom: 8px }
.muted { color: var(--ink-2) } .small { font-size: 13px } .tiny { font-size: 12px; color: var(--ink-3) }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.row.end { justify-content: flex-end } .grow { flex: 1 1 auto }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start }
.split.doc { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) }
@media (max-width: 1100px) { .split, .split.doc { grid-template-columns: minmax(0, 1fr) } .split.doc > div[style*=sticky] { position: static !important } }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0 }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 7px 14px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap }
.btn:hover { background: var(--surface-2) }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn) }
.btn.primary:hover { background: var(--btn-hover) }
.btn.warn { color: var(--danger); border-color: var(--danger) }
.btn.ghost { border-color: transparent; background: none }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 13px }
.btn[disabled] { opacity: .45; cursor: not-allowed }
.btn svg { width: 16px; height: 16px; flex: none }
.btn.wrap { white-space: normal; text-align: left; justify-content: flex-start; max-width: 100% }
.btn.wrap.next { text-align: right; justify-content: flex-end; margin-left: auto }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap }
.chip.amber { background: var(--amber-soft); color: var(--ink); border-color: var(--amber-line) }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent }
.chip.unit { font-family: var(--f-mono); font-weight: 500 }
.dots { letter-spacing: 1px; color: var(--amber) }

.callout { border-radius: var(--r); padding: 13px 15px; border: 1px solid var(--line); background: var(--info-soft); display: flex; gap: 12px; align-items: flex-start }
.callout b { display: block; margin-bottom: 2px }
.callout.warn { background: var(--amber-soft); border-color: var(--amber-line) }
.callout.danger { background: var(--danger-soft); border-color: transparent; border-left: 5px solid var(--danger) }
.callout > svg { flex: none; width: 22px; height: 22px; margin-top: 1px }
.callout.danger > svg { color: var(--danger) }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0 }
.field label, .lbl { font-size: 12.5px; font-weight: 700; color: var(--ink-2); letter-spacing: .01em }
.field input, .field select, .field textarea, .inp {
  width: 100%; min-height: 38px; padding: 7px 10px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); color: var(--ink) }
.field textarea { min-height: 76px; resize: vertical; line-height: 1.45 }
.field .hint { font-size: 12px; color: var(--ink-3) }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; cursor: pointer }
.check input { width: 17px; height: 17px; accent-color: var(--brand-2) }
fieldset { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; margin: 0; min-width: 0 }
legend { font-size: 12.5px; font-weight: 700; color: var(--ink-2); padding: 0 4px }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto }
.tabs button { border: 0; background: none; padding: 9px 13px; cursor: pointer; color: var(--ink-2); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--amber) }

.empty { border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 22px; text-align: center; color: var(--ink-2) }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--amber-soft); border: 1px solid var(--amber-line); border-radius: var(--r-sm); padding: 8px 10px; font-size: 13.5px }

/* ---------- início */
.hero { background: var(--brand); color: var(--brand-ink); border-radius: var(--r); padding: 24px 24px 22px; position: relative; overflow: hidden }
.hero::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px); background-size: 24px 24px; pointer-events: none }
.hero > * { position: relative; z-index: 1 }
.hero .eyebrow { color: var(--amber) }
.hero h1 { color: var(--brand-ink); font-size: clamp(30px, 4vw, 44px); font-weight: 700; margin: 6px 0 8px }
.hero p { color: var(--brand-ink-2); max-width: 62ch }
.hero .flagline { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; display: flex; z-index: 1 }
.hero .flagline i { flex: 1 } .hero .flagline i:nth-child(1) { background: #C8102E } .hero .flagline i:nth-child(2) { background: #F2C200 } .hero .flagline i:nth-child(3) { background: #00843D }
.hero .book { position: absolute; right: 22px; top: 18px; width: 150px; height: 96px; z-index: 0; opacity: .85 }
@media (max-width: 760px) { .hero .book { display: none } }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; color: var(--ink); box-shadow: var(--shadow) }
.tile:hover { border-color: var(--line-2); transform: translateY(-1px) }
.tile .k { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; color: var(--ink-3); text-transform: uppercase }
.tile b { font-family: var(--f-display); font-size: 20px; font-weight: 700 }
.tile span { color: var(--ink-2); font-size: 14px }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px }
.meter { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px }
.meter b { display: block; font-family: var(--f-mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1 }
.meter span { font-size: 12.5px; color: var(--ink-2) }

/* ---------- biblioteca */
.lib { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 18px; align-items: start }
@media (max-width: 1000px) { .lib { grid-template-columns: minmax(0, 1fr) } }
.tree { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px); max-height: calc(100vh - 100px); overflow: auto }
@media (max-width: 1000px) { .tree { position: static; max-height: none } }
.tree h3 { font-size: 16px; margin: 4px 0 2px }
.unit { margin-top: 12px }
.unit > div { font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px }
.lsn { display: flex; gap: 9px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: var(--r-sm); cursor: pointer; color: var(--ink-2); align-items: baseline }
.lsn:hover { background: var(--surface-2); color: var(--ink) }
.lsn[aria-current="true"] { background: var(--amber-soft); color: var(--ink); font-weight: 650 }
.lsn .n { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); flex: none }
.lesson { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 74px) }
.lesson h2 { font-size: clamp(25px, 3vw, 32px); margin: 4px 0 8px }
.lesson section { margin-top: 18px }
.lesson section > h3 { font-size: 17px; margin-bottom: 7px; display: flex; align-items: center; gap: 8px }
.lesson section > h3::before { content: ""; width: 10px; height: 10px; border: 2px solid var(--amber); border-radius: 50%; flex: none }
.lesson ul, .lesson ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px }
.lesson .resumo p + p { margin-top: 8px }
.lesson .resumo { font-size: 16px; max-width: 72ch }
.kw { display: flex; flex-wrap: wrap; gap: 6px }
.kw button { cursor: pointer }
.pn { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; flex-wrap: wrap }
.gloss dl { margin: 0; display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr); gap: 10px 18px }
.gloss dt { font-weight: 700 } .gloss dd { margin: 0; color: var(--ink-2) }
@media (max-width: 640px) { .gloss dl { grid-template-columns: minmax(0, 1fr) } .gloss dd { margin-bottom: 8px } }
.syms { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px }
.sym { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px }
.sym svg { width: 100%; height: 64px; color: var(--ink); display: block; margin-bottom: 6px }
.sym b { display: block; font-size: 14.5px } .sym span { font-size: 13px; color: var(--ink-2) }

/* ---------- folhas (pré-visualização dos documentos) */
.sheetwrap { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; overflow-x: auto }
.sheet { background: var(--sheet); color: var(--sheet-ink); width: 100%; max-width: 760px; margin: 0 auto; padding: 32px 34px; box-shadow: 0 2px 10px rgba(10, 34, 64, .18); font: 13.5px/1.45 var(--f-body) }
.sheet h1, .sheet h2, .sheet h3 { color: var(--sheet-navy); font-family: var(--f-body); font-weight: 700 }
.sheet h1 { font-size: 20px; border-bottom: 2px solid var(--sheet-gold); padding-bottom: 4px; margin: 8px 0 8px }
.sheet h2 { font-size: 15.5px; margin: 14px 0 5px } .sheet h3 { font-size: 14px; margin: 10px 0 4px }
.sheet p { margin: 0 0 5px }
.sheet ul, .sheet ol { margin: 0 0 6px; padding-left: 22px }
.sheet table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 0 0 8px }
.sheet td, .sheet th { border: 1px solid var(--sheet-line); padding: 4px 6px; vertical-align: top; text-align: left; word-wrap: break-word }
.sheet th, .sheet td.sh { background: var(--sheet-head) }
.sheet th { overflow-wrap: normal; word-break: keep-all }
.sheet table.nb td { border: 0; padding: 0 }
.sheet .c-navy { color: var(--sheet-navy) } .sheet .c-gold { color: var(--sheet-gold) } .sheet .c-mute { color: var(--sheet-mute) }
.sheet .pbreak { border-top: 2px dashed var(--sheet-line); margin: 22px -34px; position: relative }
.sheet .pbreak::after { content: "nova página"; position: absolute; left: 50%; top: -9px; transform: translateX(-50%); background: var(--sheet); color: var(--sheet-mute); font-size: 11px; padding: 0 8px }
.sheet .ind { padding-left: 24px }
@media (max-width: 600px) { .sheet { padding: 18px 16px; font-size: 12.5px } .sheet .pbreak { margin-left: -16px; margin-right: -16px } }

/* ---------- listas guardadas e banco */
.items { display: flex; flex-direction: column; gap: 10px }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center }
.item .t { font-weight: 700 } .item .grow { min-width: 200px }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 7px }
.q .txt { font-size: 15px } .q ol { margin: 0; padding-left: 22px }
.q details summary { cursor: pointer; color: var(--link); font-size: 13.5px; font-weight: 600 }
.q .ans { margin-top: 6px; background: var(--ok-soft); border-radius: var(--r-sm); padding: 8px 10px; font-size: 14px }
.q li.ok { font-weight: 700; color: var(--ok) }
.sel { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface) }
.sel .n { font-family: var(--f-mono); font-size: 13px; color: var(--ink-3); width: 26px }
.sel .tx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px }
.sel .act { display: flex; gap: 2px }
.sel .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 2px }
.cotl { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2) }
.cotl input { width: 58px; min-height: 28px; padding: 2px 6px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); font-family: var(--f-mono); font-size: 13px; text-align: right }
.cotl input::placeholder { color: var(--ink-3); opacity: 1 }
.picker { max-height: 360px; overflow: auto; display: flex; flex-direction: column; gap: 6px }

/* ---------- calculadoras */
.calcs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr)); gap: 16px; align-items: start }
.calc h2 { font-size: 20px; margin-bottom: 2px }
.formula { font-family: var(--f-mono); background: var(--surface-2); border-radius: var(--r-sm); padding: 6px 10px; display: inline-block; font-size: 14px }
.result { margin-top: 12px; border-top: 1px dashed var(--line-2); padding-top: 12px }
.result .big { font-family: var(--f-mono); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums }
.result .steps { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); margin-top: 4px; white-space: pre-wrap }
.result.err .big { font-size: 15px; font-family: var(--f-body); color: var(--danger) }
.ohm { width: 120px; height: 104px; flex: none; color: var(--ink) }
.tbl { overflow-x: auto; position: relative }
.tbl table { width: 100%; border-collapse: collapse; min-width: 480px }
.tbl th { text-align: left; font-size: 12px; color: var(--ink-2); font-weight: 700; padding: 4px 6px; border-bottom: 1px solid var(--line) }
.tbl td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: middle }
.tbl td.num { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
.tbl input { width: 100%; min-height: 34px; padding: 5px 8px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface) }
.tbl input.n { text-align: right; font-family: var(--f-mono) }

/* ---------- avisos */
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 520px) }
#toast div { background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: 14px; box-shadow: var(--shadow); animation: tin .2s ease }
@keyframes tin { from { opacity: 0; transform: translateY(6px) } }
@media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important } }

/* ---------- impressão (só no ficheiro sem internet) */
#print-root { display: none }
@media print {
  @page { size: A4; margin: 14mm 14mm 14mm 20mm }
  body { background: #fff !important; background-image: none !important }
  body::before { display: none }
  body > *:not(#print-root) { display: none !important }
  #print-root { display: block !important }
  #print-root .sheet { box-shadow: none; padding: 0; max-width: none; font-size: 11pt }
  #print-root .pbreak { break-before: page; border: 0; margin: 0 }
  #print-root .pbreak::after { display: none }
}

/* ---------- biblioteca dos manuais */
.picker-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.picker-row .lbl { margin-right: 4px }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px }
.seg button { border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 600; font-size: 13.5px }
.seg button[aria-pressed="true"] { background: var(--btn); border-color: var(--btn); color: var(--btn-ink) }
.seg button:hover { border-color: var(--ink-3) }
.toc { display: flex; flex-direction: column; gap: 2px }
.toc .grp { font-size: 11.5px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin: 12px 0 4px; padding: 0 8px }
.lesson .resp { margin-top: 6px; background: var(--ok-soft); border-radius: var(--r-sm); padding: 7px 10px; font-size: 14.5px }
.lesson .resp b { color: var(--ok) }
.ex-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px }
.ex-list li { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px }
.ex-list .t { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 3px }
.ex-list .t b { font-family: var(--f-mono); color: var(--ink-3); font-weight: 500 }
.ex-list .qn { font-family: var(--f-mono); color: var(--ink-3); font-weight: 500; margin-right: 8px }
.ex-list .chip { margin-right: 8px; vertical-align: 1px }
.pares { display: grid; grid-template-columns: max-content auto minmax(0, 1fr); gap: 2px 10px; margin: 6px 0 0 26px; font-size: 14.5px }
.pares .ar { color: var(--ink-3) }
.folha { font-family: var(--f-mono); font-size: 13px; line-height: 1.3; background: var(--sheet); color: var(--sheet-ink); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; overflow-x: auto; white-space: pre; max-width: 100% }
.kv { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr); gap: 6px 14px }
.kv dt { font-weight: 700; color: var(--ink-2); font-size: 13.5px } .kv dd { margin: 0 }
@media (max-width: 600px) { .kv { grid-template-columns: minmax(0, 1fr) } .kv dd { margin-bottom: 6px } }
.datatbl { overflow-x: auto } .datatbl table { border-collapse: collapse; width: 100%; font-size: 14px } .datatbl th, .datatbl td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top }
.datatbl th { background: var(--surface-2); font-size: 12.5px }
.results { display: flex; flex-direction: column; gap: 6px }
.results button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 9px 12px; cursor: pointer; color: var(--ink); display: flex; flex-direction: column; gap: 2px }
.results button:hover { border-color: var(--line-2) }
.results .w { font-size: 12px; color: var(--ink-3) }
.dic-e { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 4px 10px; padding: 10px 0; border-bottom: 1px dashed var(--line) }
.dic-e .em { font-size: 24px; line-height: 1.1 } .dic-e .cr { color: var(--ok); font-weight: 700 }
.lvl { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 6px } .lvl.J { background: #F2C200 } .lvl.L1 { background: #00843D } .lvl.L2 { background: #C8102E }
.big-tab { font-family: var(--f-mono); font-size: clamp(20px, 3.4vw, 30px); display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 4px 28px }
.big-tab div { padding: 4px 0; border-bottom: 1px dashed var(--line) } .big-tab b { color: var(--ok) }
.note-box { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: var(--r-sm); padding: 8px 10px }
.more { align-self: center }

/* calendário de atividades: uma linha por atividade, com a cor da categoria na margem (a categoria também vai escrita) */
.cal-list { display: flex; flex-direction: column; gap: 8px }
.cal-ev { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--cal-c, var(--line-2)); border-radius: var(--r-sm); padding: 10px 12px; scroll-margin-top: 90px }
.cal-ev.passou { opacity: .6 }
.cal-ev.tri { background: var(--surface-2) }
.cal-d { display: flex; flex-direction: column; align-items: center; line-height: 1.15; color: var(--ink-2); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em }
.cal-d b { font-family: var(--f-display); font-size: 25px; color: var(--ink); letter-spacing: 0; font-weight: 700 }
.cal-tx > b { display: block; font-weight: 650; line-height: 1.35 }
.cal-meta { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 13px; color: var(--ink-2); margin-top: 3px }
.cal-cat { display: inline-flex; align-items: center; gap: 6px; font-weight: 650 }
.cal-cat i { width: 9px; height: 9px; border-radius: 50%; background: var(--cal-c, var(--line-2)); flex: none }
.cal-q { font-size: 12.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap }
.cal-q.perto { color: var(--amber-ink); background: var(--amber); border-radius: 999px; padding: 3px 10px }
.cal-mes h2 { font-size: 19px; margin: 8px 0 10px }
.g-reuniao { --cal-c: #2F6FED } .g-familias { --cal-c: #1F9D60 } .g-provas { --cal-c: #E0A100 } .g-aida { --cal-c: #9B5BD6 } .g-letiva { --cal-c: #5B7DB8 }
.g-feriado { --cal-c: #D9344B } .g-ferias { --cal-c: #E8798A } .g-matriculas { --cal-c: #13A3AE } .g-financeiro { --cal-c: #A67C2E } .g-alusiva { --cal-c: #8A95A8 }
@media (max-width: 560px) { .cal-ev { grid-template-columns: 50px minmax(0, 1fr); gap: 10px } .cal-q { grid-column: 2; justify-self: start } }

/* documentos do CEL */
.doc { padding: 22px 26px }
.doc-cap + .doc-cap { margin-top: 26px }
.doc-cap > h2 { font-size: 21px; display: flex; flex-direction: column; gap: 3px; border-bottom: 2px solid var(--amber); padding-bottom: 7px; margin: 0 0 6px }
.doc-cap > h2 .n { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 500 }
.doc-intro { display: flex; flex-direction: column; gap: 10px }
.doc-art { padding: 12px 0 10px; border-top: 1px solid var(--line); scroll-margin-top: 96px }
.doc-cap > h2 + .doc-art { border-top: 0 }
.doc-art h3 { font-size: 16.5px; margin: 0 0 6px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline }
.doc-art h3 span { font-family: var(--f-body); font-weight: 650; color: var(--ink) }
.doc-art p, .doc-intro p { margin: 6px 0; line-height: 1.55 }
.doc-art p.al { padding-left: 22px }
.doc-art ul, .doc-intro ul { margin: 6px 0; padding-left: 22px } .doc-art li { margin: 3px 0; line-height: 1.5 }
.doc-art h4, .doc-intro h4 { margin: 12px 0 4px; font-size: 15px }
.doc-art .datatbl, .doc-intro .datatbl { margin: 8px 0 }
.doc-art .callout { margin: 8px 0 }
.doc-art.alvo { background: var(--amber-soft); border-radius: var(--r-sm); padding: 12px; border-top-color: transparent }
.doc-fecho { margin-top: 28px; text-align: center; color: var(--ink-2) } .doc-fecho h3 { margin: 0 0 6px; font-size: 16px } .doc-fecho p { margin: 4px 0 }
.doc-hit { text-align: left; cursor: pointer; font: inherit; color: inherit; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline }
.doc-hit:hover { border-color: var(--line-2) }
.doc-snip { flex: 1 1 100% }
@media (max-width: 600px) { .doc { padding: 16px 14px } .doc-art p.al { padding-left: 14px } }
.doc-art p, .doc-intro p, .doc-art li, .doc .datatbl td { overflow-wrap: anywhere }
/* quadros com 3 ou mais colunas: no telemóvel, cada linha passa a um bloco «coluna: valor» */
@media (max-width: 600px) {
  .doc .datatbl.empilha table, .doc .datatbl.empilha tr, .doc .datatbl.empilha td { display: block; width: 100% }
  .doc .datatbl.empilha tr:first-child { display: none }
  .doc .datatbl.empilha tr { border: 1px solid var(--line); border-radius: var(--r-sm); margin-bottom: 8px; padding: 4px 0 }
  .doc .datatbl.empilha td { border: 0; padding: 4px 10px }
  .doc .datatbl.empilha td::before { content: attr(data-l); display: block; font-size: 11.5px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em }
}
@media (max-width: 400px) { .top .mode { display: none } }

/* formações (lista publicada pela coordenação; manuais descarregados quando o professor os pede) */
.f-top { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; align-items: start }
.f-tx h3 { margin: 2px 0 0; font-size: 18px; line-height: 1.3 }
.f-tx > .row { margin-bottom: 4px }
.f-card { scroll-margin-top: 90px }
.f-card .kv { margin: 0 }
.f-resumo p { margin: 0 0 6px; line-height: 1.5 } .f-resumo p:last-child { margin-bottom: 0 }
.f-card h3, .f-resumo p, .f-card dd { overflow-wrap: anywhere }
@media (max-width: 560px) { .f-top { grid-template-columns: 50px minmax(0, 1fr); gap: 10px } }

/* entrada: registo, pedido do código, ativação e bloqueio */
body:not(.ready) > .top, body:not(.ready) > .layout { display: none }
.gate[hidden] { display: none }
.gate { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column }
.g-top { background: var(--brand); color: var(--brand-ink); border-bottom: 3px solid var(--amber); display: flex; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)) }
.g-top img { height: 44px; width: auto; display: block }
.g-top b { display: block; font-family: var(--f-display); font-size: 20px; line-height: 1.1 }
.g-top span { display: block; font-size: 12.5px; color: var(--brand-ink-2) }
.g-main { width: 100%; max-width: 560px; margin: 0 auto; padding: 22px 16px calc(40px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px }
.g-main h1 { font-size: clamp(26px, 7vw, 32px) }
.g-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px }
.g-steps li { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-3); border-top: 3px solid var(--line); padding-top: 6px }
.g-steps li span { font-family: var(--f-mono); font-size: 11px }
.g-steps li.on { color: var(--ink); border-top-color: var(--amber); font-weight: 700 }
.g-steps li.ok { color: var(--ink-2); border-top-color: var(--ok) }
.g-device { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px }
.g-device span { font-size: 12.5px; color: var(--ink-2); font-weight: 600 }
.g-device b { font-family: var(--f-mono); font-size: 20px; font-weight: 500; letter-spacing: .06em }
.g-actions { display: flex; flex-direction: column; gap: 8px }
.g-actions .btn { width: 100%; min-height: 46px; font-size: 15px }
.g-links { display: flex; justify-content: center }
.g-err:empty { display: none }
.g-err { color: var(--danger); font-size: 14px; display: flex; flex-direction: column; gap: 4px }
.g-code { font-family: var(--f-mono) !important; font-size: clamp(13px, 4vw, 17px) !important; letter-spacing: 0; text-transform: uppercase; padding-left: 8px !important; padding-right: 8px !important }
.g-lock { width: 64px; height: 64px; border-radius: 50%; background: var(--amber-soft); color: var(--ink); display: grid; place-items: center; margin-top: 12px }
.g-lock svg { width: 30px; height: 30px }
.g-wait { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 48px 0; color: var(--ink-2) }
.g-spin { width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--amber); animation: gspin 0.9s linear infinite }
@keyframes gspin { to { transform: rotate(360deg) } }
/* instalar no ecrã do telemóvel: botão no cimo da página e pedido na primeira vez */
.b-instalar { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 6px 14px 6px 11px; border: 0; border-radius: 999px;
  background: var(--amber); color: var(--amber-ink); font: inherit; font-size: 14.5px; font-weight: 700; line-height: 1; white-space: nowrap; cursor: pointer }
.b-instalar svg { width: 18px; height: 18px; flex: none }
.b-instalar[hidden] { display: none }
.b-instalar:focus-visible { outline: 3px solid var(--brand-ink); outline-offset: 2px }
.top .b-instalar { margin-left: 10px }
@media (max-width: 400px) { .top .b-instalar { margin-left: auto } }
/* telemóveis estreitos: com o botão no cimo, o nome da escola sai da faixa (como no cimo da aplicação) */
@media (max-width: 420px) { .g-top:has(.b-instalar:not([hidden])) span { display: none } }
@media (max-width: 360px) { .g-top { gap: 10px } .g-top img { height: 38px } .g-top b { font-size: 18px } .b-instalar { padding: 6px 12px 6px 9px; font-size: 14px } }
.i-dlg { border: 0; padding: 0; border-radius: 16px; width: min(420px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto;
  background: var(--surface); color: var(--ink); box-shadow: 0 24px 60px rgba(7, 20, 40, .4) }
.i-dlg::backdrop { background: rgba(7, 20, 40, .62) }
.i-in { padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 14px }
.i-cab { display: flex; align-items: center; gap: 14px }
.i-cab img { width: 56px; height: 56px; border-radius: 14px; flex: none }
.i-cab h2 { margin: 0; font-family: var(--f-display); font-size: 24px; line-height: 1.15; color: var(--ink) }
.i-cab p { margin: 2px 0 0; font-size: 13px; color: var(--ink-2) }
.i-in > p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--ink-2) }
.i-passos { margin: 0; padding: 12px 14px 12px 34px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.4; background: var(--surface-2); border-radius: var(--r-sm) }
.i-in > p.i-nota { font-size: 13px; color: var(--ink-3) }
@media print { .b-instalar, .i-dlg { display: none !important } }
.barra[hidden] { display: none }
.barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 55; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(10, 34, 64, .12);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.barra span { flex: 1 1 200px; font-size: 14px; font-weight: 600 }

/* Portal CEL: escolha do ambiente */
.g-escolha { display: flex; flex-direction: column; gap: 10px }
.g-op { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px; border: 1.5px solid var(--line); border-radius: var(--r);
  background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; box-shadow: var(--shadow) }
.g-op:hover, .g-op:focus-visible { border-color: var(--amber) }
.g-op:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px }
.g-op-ic { width: 46px; height: 46px; border-radius: 50%; background: var(--amber-soft); color: var(--ink); display: grid; place-items: center; flex: none }
.g-op-ic svg { width: 24px; height: 24px }
.g-op b { display: block; font-size: 17px; line-height: 1.25 }
.g-op small { display: block; color: var(--ink-2); font-size: 13.5px; line-height: 1.35; margin-top: 3px }

/* ---------- Os meus documentos (escrever como no Word) */
/* tipos de letra com as medidas do Times New Roman, do Arial e do Calibri (Liberation e Carlito, SIL OFL; ver fonts/cel-letra-LICENCA-OFL.txt).
   Só se descarregam quando se abre um documento; num computador com os tipos de letra do Word usa os do próprio computador. */
@font-face{font-family:"CEL Doc Serif";font-style:normal;font-weight:400;font-display:swap;src:local("Times New Roman"),local("TimesNewRomanPSMT"),url(fonts/cel-letra-serif-400.woff) format("woff")}
@font-face{font-family:"CEL Doc Serif";font-style:normal;font-weight:700;font-display:swap;src:local("Times New Roman Bold"),local("TimesNewRomanPS-BoldMT"),url(fonts/cel-letra-serif-700.woff) format("woff")}
@font-face{font-family:"CEL Doc Serif";font-style:italic;font-weight:400;font-display:swap;src:local("Times New Roman Italic"),local("TimesNewRomanPS-ItalicMT"),url(fonts/cel-letra-serif-400i.woff) format("woff")}
@font-face{font-family:"CEL Doc Serif";font-style:italic;font-weight:700;font-display:swap;src:local("Times New Roman Bold Italic"),local("TimesNewRomanPS-BoldItalicMT"),url(fonts/cel-letra-serif-700i.woff) format("woff")}
@font-face{font-family:"CEL Doc Sans";font-style:normal;font-weight:400;font-display:swap;src:local("Arial"),local("ArialMT"),url(fonts/cel-letra-sans-400.woff) format("woff")}
@font-face{font-family:"CEL Doc Sans";font-style:normal;font-weight:700;font-display:swap;src:local("Arial Bold"),local("Arial-BoldMT"),url(fonts/cel-letra-sans-700.woff) format("woff")}
@font-face{font-family:"CEL Doc Sans";font-style:italic;font-weight:400;font-display:swap;src:local("Arial Italic"),local("Arial-ItalicMT"),url(fonts/cel-letra-sans-400i.woff) format("woff")}
@font-face{font-family:"CEL Doc Sans";font-style:italic;font-weight:700;font-display:swap;src:local("Arial Bold Italic"),local("Arial-BoldItalicMT"),url(fonts/cel-letra-sans-700i.woff) format("woff")}
@font-face{font-family:"CEL Doc Sans C";font-style:normal;font-weight:400;font-display:swap;src:local("Calibri"),url(fonts/cel-letra-calibri-400.woff) format("woff")}
@font-face{font-family:"CEL Doc Sans C";font-style:normal;font-weight:700;font-display:swap;src:local("Calibri Bold"),local("Calibri-Bold"),url(fonts/cel-letra-calibri-700.woff) format("woff")}
@font-face{font-family:"CEL Doc Sans C";font-style:italic;font-weight:400;font-display:swap;src:local("Calibri Italic"),local("Calibri-Italic"),url(fonts/cel-letra-calibri-400i.woff) format("woff")}
@font-face{font-family:"CEL Doc Sans C";font-style:italic;font-weight:700;font-display:swap;src:local("Calibri Bold Italic"),local("Calibri-BoldItalic"),url(fonts/cel-letra-calibri-700i.woff) format("woff")}

.esc-modelos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px }
.esc-modelo { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); cursor: pointer; font: inherit }
.esc-modelo:hover { border-color: var(--ink-3); background: var(--surface-2) }
.esc-modelo:focus-visible, .esc-item-abre:focus-visible, .esc-b:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.esc-modelo b { font-size: 15px } .esc-modelo span { font-size: 13px; color: var(--ink-2); line-height: 1.4 }
.esc-lista { display: flex; flex-direction: column; gap: 8px; margin-top: 12px }
.esc-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 4px 6px 4px 12px; background: var(--surface) }
.esc-item-abre { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 8px 0; cursor: pointer; color: var(--ink); font: inherit; display: flex; flex-direction: column; gap: 2px }
.esc-item-abre b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.esc-item-abre span { font-size: 12.5px; color: var(--ink-2) }
.esc-aviso { border-color: var(--danger); background: var(--danger-soft) }

.esc-vista { gap: 10px }
.esc-cab { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between }
.esc-cab .btn svg { width: 16px; height: 16px }
.esc-estado { min-width: 0 }
.esc-titulo { font: 700 22px/1.25 "Lora", Georgia, serif; border: 0; border-bottom: 2px solid var(--line); background: none; color: var(--ink); padding: 6px 2px; width: 100%; box-sizing: border-box }
.esc-titulo:focus { outline: none; border-bottom-color: var(--amber) }
.esc-barras { position: sticky; top: 0; z-index: 20; display: flex; flex-direction: column; gap: 4px; padding: 4px 0; background: var(--bg, transparent) }
.esc-barra { display: flex; gap: 2px; align-items: center; overflow-x: auto; scrollbar-width: thin; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 4px; box-shadow: var(--shadow) }
.esc-b { flex: none; min-width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: none; color: var(--ink); cursor: pointer; padding: 0 6px; font-family: inherit; font-size: 15px; font-weight: 700; line-height: 1 }
.esc-b:hover { background: var(--surface-2) }
.esc-b[aria-pressed="true"] { background: var(--amber-soft); box-shadow: inset 0 0 0 1px var(--amber-line) }
.esc-b svg { width: 20px; height: 20px }
.esc-b.neg .esc-l { font-weight: 900 } .esc-b.ita .esc-l { font-style: italic; font-family: Georgia, serif } .esc-b.sub .esc-l { text-decoration: underline }
.esc-b.txt { font-size: 13px; font-weight: 650 } .esc-b.perigo { color: var(--danger) }
.esc-sep { flex: none; width: 1px; height: 22px; background: var(--line); margin: 0 4px }
.esc-sub { display: flex; gap: 2px; align-items: center; overflow-x: auto; background: var(--amber-soft); border: 1px solid var(--amber-line); border-radius: var(--r-sm); padding: 3px 6px; color: var(--ink) }
.esc-sub[hidden] { display: none }
.esc-sub-t { font-size: 12.5px; font-weight: 700; margin-right: 6px; white-space: nowrap }
/* barra de estado, como a do Word: página onde está o cursor, total de páginas e palavras */
.esc-rodape { position: sticky; bottom: 0; z-index: 15; display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: space-between; align-items: center; color: var(--ink-2); font-size: 13px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 12px; box-shadow: var(--shadow) }
.esc-rodape b { color: var(--ink); font-weight: 700 }
.esc-pagina-at { font-variant-numeric: tabular-nums }
.esc-aprox { color: var(--warn, #8a5a00) }

/* a folha: papel branco, também no modo escuro */
.esc-folha { --esc-tam: 12pt; --esc-simples: 1.15; --esc-espaco: 1.725; --esc-lh: 27.6px; --esc-lh-1: 18.4px; --esc-lh-t1: 24.53px; --esc-lh-t2: 22px; --esc-lh-t3: 18.4px; --esc-lh-cit: 15.33px; --esc-lh-nota: 15.33px; --esc-recuo: 0cm; --esc-depois: 6pt; --esc-num-tam: 12pt; --esc-lh-num: 18.4px;
  --esc-mt: 2.5cm; --esc-md: 2.5cm; --esc-mb: 2.5cm; --esc-me: 2.5cm; position: relative;
  background: #fff; color: #111; width: 100%; max-width: var(--esc-pw, 21cm); margin: 0 auto; min-height: var(--esc-ph, 29.7cm); padding: var(--esc-mt) var(--esc-md) var(--esc-mb) var(--esc-me);
  box-shadow: 0 2px 12px rgba(10, 34, 64, .12); border: 1px solid #d9dee7; border-radius: 4px; box-sizing: border-box; color-scheme: light }
:is(.esc-folha, .esc-pg, .esc-medir)[data-letra="serif"] { font-family: "CEL Doc Serif", "Times New Roman", "Liberation Serif", Tinos, serif }
:is(.esc-folha, .esc-pg, .esc-medir)[data-letra="sans"] { font-family: "CEL Doc Sans", Arial, "Liberation Sans", Arimo, sans-serif }
:is(.esc-folha, .esc-pg, .esc-medir)[data-letra="calibri"] { font-family: "CEL Doc Sans C", Calibri, Carlito, sans-serif }

/* tipografia igual à dos estilos do ficheiro Word (Normal, Título 1-3, Citação, Parágrafo de Lista, Índice, Texto de Nota de Rodapé):
   - entrelinha = espaçamento escolhido × «simples» do tipo de letra; espaço depois dos parágrafos 6 pt;
   - entre dois parágrafos fica o maior dos dois espaços (o «depois» de um e o «antes» do outro), como no Word: são margens CSS;
   - no cimo de cada folha, menos da primeira, o espaço antes não conta (também como no Word). */
:is(.esc-texto, .esc-pag) { font-size: var(--esc-tam); line-height: var(--esc-lh); color: #111; text-align: left; overflow-wrap: anywhere; word-wrap: break-word;
  font-kerning: none; font-variant-ligatures: none; font-feature-settings: "kern" 0, "liga" 0 }
:is(.esc-texto, .esc-pag) p { margin: 0 0 var(--esc-depois, 6pt); text-indent: var(--esc-recuo, 0cm) }
:is(.esc-texto, .esc-pag) :is(p[style*="center"], p[style*="right"], td p, th p, li p, blockquote p) { text-indent: 0 }      /* recuo da 1.ª linha só no texto normal (como no Word) */
.esc-just :is(.esc-texto, .esc-pag) :is(p, li) { text-align: justify }
:is(.esc-texto, .esc-pag) :is(h1, h2, h3) { font-family: inherit; color: #111; letter-spacing: normal; text-wrap: wrap; font-weight: 700; line-height: var(--esc-lh-1); break-after: avoid; margin: 0; text-align: left }
:is(.esc-texto, .esc-pag) h1 { font-size: var(--esc-h1-tam, calc(var(--esc-tam) + 4pt)); line-height: var(--esc-lh-t1); margin: var(--esc-h1-antes, 18pt) 0 var(--esc-h1-depois, 8pt); text-align: var(--esc-h1-alinh, left) }
:is(.esc-texto, .esc-pag) h2 { font-size: var(--esc-h2-tam, calc(var(--esc-tam) + 2pt)); line-height: var(--esc-lh-t2); margin: var(--esc-h2-antes, 12pt) 0 var(--esc-h2-depois, 6pt); text-align: var(--esc-h2-alinh, left) }
:is(.esc-texto, .esc-pag) h3 { font-size: var(--esc-h3-tam, var(--esc-tam)); line-height: var(--esc-lh-t3, var(--esc-lh-1)); font-style: italic; margin: var(--esc-h3-antes, 10pt) 0 var(--esc-h3-depois, 5pt); text-align: var(--esc-h3-alinh, left) }
/* citação longa (botão ❝): recuo, letra e espaço da norma (ABNT 4 cm e letra menor; APA 1,27 cm e espaço duplo); justificada só com o texto justificado */
:is(.esc-texto, .esc-pag) blockquote { margin: 6pt 0 10pt var(--esc-cit-recuo, 4cm); font-size: var(--esc-cit-tam, calc(var(--esc-tam) - 2pt)); line-height: var(--esc-lh-cit); text-align: left }
.esc-just :is(.esc-texto, .esc-pag) blockquote { text-align: justify }
:is(.esc-texto, .esc-pag) blockquote p { margin: 0 }
/* ABNT (NBR 14724): natureza do trabalho na folha de rosto, do meio da mancha para a margem direita, em espaço simples e com o tamanho do texto */
:is(.esc-texto, .esc-pag) blockquote.esc-natureza { margin: 0 0 0 50%; font-size: var(--esc-tam); line-height: var(--esc-lh-1) }
:is(.esc-texto, .esc-pag) :is(ul, ol) { margin: 0 0 3pt; padding-left: 1.27cm }
:is(.esc-texto, .esc-pag) :is(ul, ol):has(+ :is(ul, ol)) { margin-bottom: 0 }      /* duas listas seguidas: sem espaço (Word: «não adicionar espaço entre parágrafos do mesmo estilo») */
.esc-medir-corpo, .esc-pg-corpo { display: flow-root }
.esc-pg-seguinte > :first-child { margin-top: 0 !important }
:is(.esc-texto, .esc-pag) li { margin: 0 } :is(.esc-texto, .esc-pag) li p { margin: 0 }
:is(.esc-texto, .esc-pag) li > :is(ul, ol) { margin: 0; padding-left: .635cm }
:is(.esc-texto, .esc-pag) ul ul { list-style-type: circle } :is(.esc-texto, .esc-pag) ul ul ul { list-style-type: square }
:is(.esc-texto, .esc-pag) ol ol { list-style-type: lower-alpha } :is(.esc-texto, .esc-pag) ol ol ol { list-style-type: lower-roman }
:is(.esc-texto, .esc-pag) img { max-width: 100%; max-height: var(--esc-hmax, none); height: auto; vertical-align: baseline; object-fit: contain }
:is(.esc-texto, .esc-pag) p:has(> img) { line-height: var(--esc-lh-1); text-indent: 0 }
:is(.esc-texto, .esc-pag) table { border-collapse: collapse; width: 100%; margin: 0; table-layout: fixed }
:is(.esc-texto, .esc-pag) :is(td, th) { border: .5pt solid #808080; padding: 2pt .176cm; vertical-align: top; line-height: var(--esc-lh-1); word-break: break-word; text-align: left }
.esc-just :is(.esc-texto, .esc-pag) :is(td, th) p { text-align: left }
:is(.esc-texto, .esc-pag) th { background: #E9EDF4; font-weight: 700 }
:is(.esc-texto, .esc-pag) :is(td, th) p { margin: 0 }
:is(.esc-texto, .esc-pag) :is(sup, sub) { line-height: 0 }
:is(.esc-texto, .esc-pag) .esc-nota { font-size: .7em; vertical-align: super; line-height: 0 }
/* índice: entradas com pontinhos até ao número da página (estilos Índice 1, 2 e 3 do Word) */
:is(.esc-texto, .esc-pag) .esc-indice ol { list-style: none; margin: 0; padding: 0 }
:is(.esc-texto, .esc-pag) .esc-indice li { display: flex; align-items: baseline; margin: 0 0 3pt; line-height: var(--esc-lh) }
.esc-just :is(.esc-texto, .esc-pag) .esc-indice li { text-align: left }
:is(.esc-texto, .esc-pag) .esc-indice li.n1 { font-weight: 700 }
:is(.esc-texto, .esc-pag) .esc-indice li.n2 { padding-left: .7056cm } :is(.esc-texto, .esc-pag) .esc-indice li.n3 { padding-left: 1.4111cm }
.esc-ind-t { flex: 0 1 auto; min-width: 0 } .esc-ind-l { flex: 1 1 0; min-width: .8em; border-bottom: 1.2px dotted currentColor; margin: 0 .3em; position: relative; top: -.28em }
.esc-ind-p { flex: none; font-variant-numeric: tabular-nums }
/* partes de um parágrafo, de uma lista ou de uma tabela que continuam de uma folha para a outra */
.esc-pag .esc-cont { padding-top: 0 !important; margin-top: 0 !important; text-indent: 0 !important }
.esc-pag li.esc-cont { list-style-type: none }
.esc-just .esc-pag :is(p, li).esc-corta, .esc-pag :is(p, li).esc-corta[style*="justify"] { text-align-last: justify }
.esc-pag hr.esc-quebra { border: 0; margin: 0; height: 0; overflow: visible }      /* como no editor: as margens à volta juntam-se */
.esc-pag .esc-indice-t, .esc-pag .esc-indice-n { display: none }

/* só no editor */
.esc-texto { outline: none; min-height: 18cm; caret-color: #0A2240 }
.esc-texto img.esc-sel { outline: 3px solid #F2B705; outline-offset: 2px }
.esc-texto .esc-nota { color: #1B4C9A; cursor: pointer; user-select: none }
.esc-texto hr.esc-quebra { border: 0; border-top: 2px dashed #b9c2d0; margin: 1.4em 0; overflow: visible; height: 0; position: relative }
.esc-texto hr.esc-quebra::after { content: "quebra de página"; position: absolute; left: 50%; top: -.8em; transform: translateX(-50%); background: #fff; color: #7a8597; font: 600 11px/1.4 system-ui, sans-serif; padding: 0 8px }
.esc-texto .esc-indice { border: 1px dashed #b9c2d0; border-radius: 6px; padding: 10px 14px; margin: .5em 0 1em; background: #f7f9fc; user-select: none; cursor: default }
.esc-indice-t { font: 700 11px/1.4 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .06em; color: #7a8597; margin-bottom: 4px }
.esc-indice-n { font: 12px/1.4 system-ui, sans-serif; color: #7a8597; margin: 6px 0 0 }
.esc-romanas .esc-texto [data-arabe]::before { content: "Aqui começa a numeração das páginas"; display: block; width: max-content; margin-bottom: 4px; padding: 1px 8px; border-radius: 8px; text-indent: 0;
  background: #eef3fb; color: #4b5d78; font: 600 11px/1.5 system-ui, sans-serif; font-style: normal }
.esc-notas { border-top: 1px solid #c9ced8; margin-top: 1.5em; padding-top: .6em; font-size: 10pt; line-height: 1.35; color: #222 }
.esc-notas:empty { display: none }
.esc-notas-t { font: 700 11px/1.4 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .06em; color: #7a8597; margin-bottom: 4px }
.esc-notas ol { margin: 0; padding-left: 1.4em }
.esc-link { background: none; border: 0; padding: 0; color: #1B4C9A; text-decoration: underline; cursor: pointer; font: 600 12px system-ui, sans-serif }
@media (max-width: 700px) {
  .esc-folha:not(.esc-vista-paginas) { padding: 18px 14px 28px; min-height: 60vh; border-radius: 6px }
  .esc-folha:not(.esc-vista-paginas) .esc-texto { min-height: 50vh }
  .esc-folha:not(.esc-vista-paginas) .esc-texto blockquote { margin-left: 2em }
  .esc-titulo { font-size: 19px }
}

/* caixas (imagem, tabela, nota, página) */
.esc-dlg { border: 0; border-radius: var(--r); padding: 18px; width: min(92vw, 480px); max-height: 90vh; overflow: auto; background: var(--surface); color: var(--ink); box-shadow: 0 20px 50px rgba(0, 0, 0, .3) }
.esc-dlg::backdrop { background: rgba(10, 20, 40, .45) }
.esc-dlg h3 { margin: 0 0 12px }
.esc-dlg textarea.inp, .esc-dlg select.inp, .esc-dlg input.inp { width: 100%; box-sizing: border-box }
.esc-grelha { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.esc-grelha label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600 }
.esc-grelha label.larga, .esc-grelha .larga { grid-column: 1 / -1 }
.esc-grelha label.esc-chk, .esc-chk { flex-direction: row; align-items: center; gap: 8px; font-weight: 500 }
.esc-grupo { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px 12px; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.esc-grupo legend { font-size: 13px; font-weight: 700; padding: 0 6px }
.esc-grupo .esc-dica { grid-column: 1 / -1; margin: 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.4 }
.esc-grupo [disabled] { opacity: .55 }

/* folhas A4 (Ver páginas e PDF): o mesmo desenho que vai para a impressora */
.esc-pg { position: relative; flex: none; background: #fff; color: #111; overflow: hidden; color-scheme: light; box-sizing: border-box }
.esc-pg-area { position: absolute; overflow: hidden }
.esc-pg-notas { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10pt; line-height: var(--esc-lh-nota); padding-top: var(--esc-lh-1); color: #111;
  font-kerning: none; font-variant-ligatures: none }
.esc-pg-notas::before { content: ""; position: absolute; left: 0; top: calc(var(--esc-lh-1) * .55); width: 5.08cm; border-top: .5pt solid #111 }
.esc-pg-notas p { margin: 0; text-align: justify }
.esc-pg-notas sup { font-size: .7em; line-height: 0; vertical-align: super }
/* cabeçalho e rodapé: três lugares (esquerda, centro, direita), como as tabulações do Word; um só lugar: parágrafo alinhado, na largura toda */
.esc-pg-hf { position: absolute; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); font-size: var(--esc-num-tam, var(--esc-tam)); line-height: var(--esc-lh-num, var(--esc-lh-1));
  color: #111; white-space: pre-wrap; overflow-wrap: anywhere; font-kerning: none; font-variant-ligatures: none; z-index: 2 }
.esc-hf-l { grid-area: 1 / 1; text-align: left } .esc-hf-c { grid-area: 1 / 2; text-align: center; padding: 0 .4em } .esc-hf-r { grid-area: 1 / 3; text-align: right }
.esc-pg-hf.esc-hf-so > span { grid-column: 1 / -1; padding: 0 }
.esc-medir { position: absolute; left: -40000px; top: 0; visibility: hidden; pointer-events: none }
.esc-medir-notas { position: static !important }

.esc-ver { border: 0; padding: 0; margin: 0; width: 100vw; height: 100dvh; max-width: none; max-height: none; background: #4d576a; color: #fff; overflow: auto }
.esc-ver::backdrop { background: rgba(10, 20, 40, .6) }
.esc-ver-cab { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 14px; background: #0A2240; color: #fff }
.esc-ver-cab b { font-size: 15px }
.esc-ver-cab .btn svg { width: 16px; height: 16px }
.esc-ver-cab .btn { background: #fff; color: #0A2240; border-color: #fff }
.esc-ver-cab .btn.primary { background: #F2B705; color: #0A2240; border-color: #F2B705 }
.esc-ver-folhas { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 12px 48px }
.esc-ver-f { position: relative; flex: none; background: #fff; box-shadow: 0 4px 18px rgba(0, 0, 0, .35) }
.esc-ver-f > .esc-pg { position: absolute; left: 0; top: 0; transform-origin: 0 0 }
.esc-ver-leg { color: #e6ebf3; font: 600 12px/1.4 system-ui, sans-serif; margin: 2px 0 12px }

/* PDF (imprimir): só as folhas */
@media print {
  #print-root .esc-pgs { display: block }
  #print-root .esc-pg { break-after: page; box-shadow: none; margin: 0 }
  #print-root .esc-pg:last-child { break-after: auto }
  /* o realce e a cor das células também saem no PDF (sem isto, o navegador não imprime os fundos) */
  #print-root .esc-pg span[style*="background"], #print-root .esc-pg td[style*="background"], #print-root .esc-pg th { -webkit-print-color-adjust: exact; print-color-adjust: exact }
}

/* ---------- vista de páginas, como no Word: folhas brancas separadas (o texto passa de uma folha para a seguinte) */
.esc-palco { width: 100%; overflow-x: auto; overflow-y: hidden; padding: 4px 0 14px }
.esc-palco-in { position: relative; margin: 0 auto }
.esc-folha.esc-vista-paginas { background: transparent; box-shadow: none; border: 0; border-radius: 0; min-height: 0; width: var(--esc-pw, 21cm); max-width: none; margin: 0;
  padding: var(--esc-mt) var(--esc-md) 0 var(--esc-me); isolation: isolate; transform-origin: 0 0 }
.esc-vista-paginas .esc-texto { position: relative; z-index: 1; min-height: 0; display: flow-root }
.esc-folha.esc-vista-paginas:not(.esc-com-folhas) { background: #fff; min-height: var(--esc-ph, 29.7cm) }      /* papel branco enquanto as folhas não estão contadas */
/* o que no editor ocupava espaço e não vai para a folha: índice sem moldura, quebra de página sem altura, sem a etiqueta do capítulo */
.esc-vista-paginas .esc-texto .esc-indice { border: 0; padding: 0; margin: 0; background: none; outline: 1px dashed #c3cfe3; outline-offset: 3px }
.esc-vista-paginas .esc-texto :is(.esc-indice-t, .esc-indice-n) { display: none }
.esc-vista-paginas .esc-texto hr.esc-quebra { border: 0; margin: 0; height: 0 }
.esc-vista-paginas .esc-texto hr.esc-quebra::after { display: none }
.esc-vista-paginas .esc-texto [data-arabe]::before { display: none }
.esc-indice li.esc-salto { margin: 0 !important }
.esc-vista-paginas .esc-notas { display: none }
.esc-fundo { position: absolute; left: 0; top: 0; width: 100%; height: 0 }
.esc-folha-pg { position: absolute; left: 0; width: var(--esc-pw, 21cm); background: #fff; box-shadow: 0 2px 10px rgba(10, 34, 64, .16); outline: 1px solid #d5dbe5; z-index: 0 }
.esc-fundo .esc-pg-hf { color: #59647a }      /* no editor, como no Word: mais claro do que o texto (muda-se em «Página» ou com duplo clique) */
.esc-fundo .esc-pg-notas { z-index: 2; position: absolute; right: auto; bottom: auto }
.esc-fundo .esc-pg-notas p { cursor: pointer; border-radius: 3px }
.esc-fundo .esc-pg-notas p:hover { background: #eef3fb }
/* separadores: não são texto (o Portal tira-os ao guardar, ao copiar e ao descarregar) */
.esc-salto { user-select: none; pointer-events: none }
span.esc-salto { display: inline-block; width: 100%; vertical-align: top; line-height: 0; font-size: 0 }
li.esc-salto { display: block; list-style: none; margin: 0; padding: 0 }
tr.esc-salto-tr > td { padding: 0 !important; border: 0 !important; background: transparent !important }
/* vista contínua (telemóvel): texto com o tamanho normal e uma faixa «Página N» de lado a lado onde começa cada folha
   (--esc-banda-esq e --esc-banda-larg: o Portal mede-as para a faixa ir da margem esquerda à direita, mesmo dentro de listas) */
.esc-vista-continuo span.esc-salto { display: block; width: auto; position: relative }      /* a linha antes da faixa não fica esticada (justificado) */
.esc-vista-continuo [data-esc-salto] { position: relative }
.esc-vista-continuo :where(span.esc-salto, [data-esc-salto])::after { position: absolute; z-index: 1; top: 6px; height: calc(var(--esc-salto, 40px) - 12px);
  left: calc(-1 * var(--esc-banda-esq, 0px)); width: var(--esc-banda-larg, 100%); display: flex; align-items: center; justify-content: center; box-sizing: border-box;
  background: #e6ebf3; border-radius: 4px; color: #3d5175; font: 650 11.5px/1 system-ui, sans-serif; font-style: normal; letter-spacing: .03em; text-indent: 0; text-align: center; white-space: nowrap }
.esc-vista-continuo span.esc-salto::after { content: "Página " attr(data-pagina) }
.esc-vista-continuo [data-esc-salto]::after { content: "Página " attr(data-esc-salto) }
.esc-vista-continuo tr.esc-salto-tr > td { position: relative; background: transparent !important }
.esc-vista-continuo tr.esc-salto-tr > td::after { content: "Página " attr(data-pagina); position: absolute; left: 0; right: 0; top: 6px; bottom: 6px; display: flex; align-items: center; justify-content: center;
  background: #e6ebf3; border-radius: 4px; color: #3d5175; font: 650 11.5px/1 system-ui, sans-serif; letter-spacing: .03em; white-space: nowrap }
/* barra de baixo: vista e zoom */
.esc-vistas { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 4px; margin-left: auto; min-width: 0 }
.esc-vbtn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 7px; padding: 4px 8px; font: 600 12.5px/1.2 inherit; cursor: pointer }
.esc-vbtn svg { width: 16px; height: 16px }
.esc-vbtn[aria-pressed="true"] { background: var(--amber-soft); color: var(--ink); border-color: var(--amber-line) }
.esc-zoom { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 7px; padding: 4px 6px; font: 600 12.5px/1.2 inherit }
/* relatório ao abrir um ficheiro Word */
.esc-relatorio ul { margin: 6px 0 0; padding-left: 20px } .esc-relatorio li { margin: 3px 0; font-size: 14px; line-height: 1.45 }
.esc-modelo.esc-abrir { border-style: dashed; background: var(--surface-2) }
/* 1.9: o atributo hidden esconde mesmo (os botões têm display próprio) */
:is(.esc-vista, .esc-dlg) [hidden] { display: none !important }
/* lixeira e modelos guardados */
.esc-dlg.esc-lixeira { width: min(94vw, 600px) }
.esc-item-lixo { cursor: default }
.esc-modelo.esc-meu { border-color: var(--amber-line); background: var(--amber-soft) }
.esc-modelo.esc-meu:hover { border-color: var(--amber) }
/* caixa «Página»: mais larga, cabeçalho e rodapé em três colunas, guardar como modelo */
.esc-dlg.esc-dlg-larga { width: min(94vw, 620px) }
.esc-hf-cab, .esc-hf-linha { display: grid; grid-template-columns: 76px repeat(3, minmax(0, 1fr)); gap: 6px; align-items: center }
.esc-hf-cab span { font-size: 11.5px; font-weight: 700; color: var(--ink-2); text-align: center }
.esc-hf-nome { font-size: 13px; font-weight: 600 }
.esc-modelo-novo { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.esc-modelo-novo .inp { flex: 1 1 200px; min-width: 0 }
@media (max-width: 520px) {
  .esc-hf-cab { display: none }
  .esc-hf-linha { grid-template-columns: repeat(3, minmax(0, 1fr)) }
  .esc-hf-nome { grid-column: 1 / -1 }
  .esc-hf-linha .inp { padding-left: 8px; padding-right: 6px; font-size: 15px }
}
/* índice: cada título leva ao lugar dele; o título pisca ao chegar */
.esc-texto .esc-indice li[data-i] { cursor: pointer; border-radius: 3px }
.esc-texto .esc-indice li[data-i]:hover .esc-ind-t { text-decoration: underline; text-underline-offset: 2px }
@keyframes esc-pisca { 0%, 55% { background-color: #fff1bf } 100% { background-color: transparent } }
.esc-texto .esc-flash { animation: esc-pisca 1.5s ease-out; background-clip: content-box; border-radius: 3px }
/* zoom: − e + à volta da lista; barra horizontal quando a folha é mais larga do que o ecrã */
.esc-zooms { display: inline-flex; align-items: center; gap: 3px }
.esc-zb { flex: none; min-width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid var(--line); border-radius: 7px;
  background: var(--surface); color: var(--ink); font: 700 16px/1 system-ui, sans-serif; cursor: pointer }
.esc-zb:hover:not(:disabled) { background: var(--surface-2) }
.esc-zb:disabled { opacity: .4; cursor: default }
@media (max-width: 520px) { .esc-zb { display: none } }      /* no telemóvel chega a lista do zoom (e o gesto de pinça) */
.esc-zb:focus-visible, .esc-hb:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.esc-hbar { flex: 1 1 100%; order: -1; display: flex; align-items: center; gap: 6px }
.esc-hbar input[type="range"] { flex: 1 1 auto; min-width: 0; margin: 0; accent-color: #0A2240 }
.esc-hb { flex: none; width: 30px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 10px; line-height: 1; cursor: pointer }
/* ecrã inteiro: sem o cimo nem o menu do Portal */
body.esc-foco .top, body.esc-foco .nav { display: none !important }
body.esc-foco .layout { grid-template-columns: minmax(0, 1fr); max-width: none; padding-block: 8px 16px }
.esc-cab .btn[aria-pressed="true"] { background: var(--amber-soft); border-color: var(--amber-line) }
/* 1.10: «Começar a numeração aqui» */
.esc-info { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; font-size: 14px; font-weight: 600 }
.esc-opcoes { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px }
.esc-opcoes .esc-chk { font-size: 14px }
.esc-aviso-num { grid-column: 1 / -1; margin: 0; font-size: 13px; line-height: 1.45; color: var(--ink-2) }
.esc-aviso-num:empty { display: none }
.esc-aviso-num.atencao { color: var(--ink); background: var(--amber-soft); border: 1px solid var(--amber-line); border-radius: var(--r-sm); padding: 7px 10px; font-weight: 600 }
/* notas de rodapé com negrito, itálico e sublinhado */
.esc-nota-barra { display: flex; gap: 2px; margin-bottom: 4px }
.esc-nota-ed { min-height: 4.5em; max-height: 40vh; overflow: auto; white-space: pre-wrap; line-height: 1.45; cursor: text }
.esc-nota-ed:empty::before { content: attr(data-vazio); color: var(--ink-3); pointer-events: none }
.esc-nota-ed:focus { outline: 2px solid var(--focus); outline-offset: 1px }
/* painel de títulos (como o «Painel de Navegação» do Word) */
.esc-corpo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start }
.esc-corpo.com-nav { grid-template-columns: 230px minmax(0, 1fr) }
.esc-nav { position: sticky; top: var(--esc-nav-top, 120px); max-height: calc(100vh - var(--esc-nav-top, 120px) - 70px); overflow: auto; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); box-shadow: var(--shadow); padding: 6px; z-index: 5 }
.esc-nav-cab { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 6px 8px; font: 700 11.5px/1.4 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3) }
.esc-nav-x { border: 0; background: none; color: var(--ink-2); font-size: 20px; line-height: 1; width: 30px; height: 30px; border-radius: 6px; cursor: pointer }
.esc-nav-x:hover { background: var(--surface-2) }
.esc-nav-lista { display: flex; flex-direction: column; gap: 1px }
.esc-nav-i { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); font: 500 13.5px/1.35 inherit; padding: 6px 8px; border-radius: 6px; cursor: pointer }
.esc-nav-i:hover { background: var(--surface-2) }
.esc-nav-i:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px }
.esc-nav-i[aria-current="true"] { background: var(--amber-soft); box-shadow: inset 3px 0 0 var(--amber) }
.esc-nav-i.n1 { font-weight: 700 } .esc-nav-i.n2 { padding-left: 18px } .esc-nav-i.n3 { padding-left: 30px; font-size: 13px; color: var(--ink-2) }
.esc-nav-t { flex: 1 1 auto; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
.esc-nav-p { flex: none; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums }
.esc-nav-vazio { margin: 0; padding: 6px 8px; font-size: 13px; color: var(--ink-2); line-height: 1.45 }
@media (max-width: 900px) {
  .esc-corpo.com-nav { grid-template-columns: minmax(0, 1fr) }
  .esc-nav { position: fixed; left: 10px; right: 10px; top: auto; bottom: 74px; max-height: 55vh; z-index: 40; box-shadow: 0 14px 40px rgba(0, 0, 0, .28) }
}
/* «Guardar como» */
.esc-op { align-items: flex-start !important; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); cursor: pointer }
.esc-op:has(input:checked) { border-color: var(--amber-line); background: var(--amber-soft) }
.esc-op input { margin-top: 3px }
.esc-op span { display: flex; flex-direction: column; gap: 2px }
.esc-op small { font-size: 12.5px; color: var(--ink-2); font-weight: 400; line-height: 1.4 }
@media (max-width: 560px) {      /* telemóvel: o cimo do editor em menos linhas */
  .esc-cab .esc-rot-m { display: none }
  .esc-cab .btn.sm { padding-inline: 9px; gap: 5px }
}
/* 1.11: cores (letra, realce, células) e barra «Mais / Menos» */
.esc-paleta { position: fixed; z-index: 60; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-sm); box-shadow: 0 12px 32px rgba(0, 0, 0, .2); padding: 8px 10px 10px }
.esc-paleta-t { font: 700 11.5px/1.4 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin-bottom: 6px }
.esc-paleta-g { display: grid; grid-template-columns: repeat(5, 30px); gap: 6px }
.esc-cor { width: 30px; height: 30px; padding: 0; border-radius: 6px; border: 1px solid rgba(0, 0, 0, .18); background: var(--c, #fff); cursor: pointer }
.esc-cor:hover, .esc-cor:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px }
.esc-cor-nada { background: var(--surface); color: var(--ink-2); font: 600 17px/1 system-ui, sans-serif }
.esc-b.cor .esc-l { font-family: Georgia, serif; font-size: 16px; border-bottom: 3px solid var(--esc-cor, #C00000); padding: 0 2px 1px; line-height: 1 }
.esc-barra.esc-menos .esc-extra { display: none }
/* no telemóvel os botões passam para a linha seguinte (todos à vista, «Mais» incluído), em vez de ficarem escondidos à direita */
@media (max-width: 700px) { .esc-barra { flex-wrap: wrap; overflow-x: visible } }
/* ---------- «Abrir ficheiros»: ver PDF, Word, Excel, PowerPoint, imagens, vídeo, som, HTML e texto */
.abr { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.abr [hidden] { display: none !important }
.abr-zona { margin-top: 14px; border: 2px dashed var(--line-2); border-radius: var(--r); padding: 28px 16px; text-align: center; cursor: pointer; background: var(--surface-2); transition: border-color .15s, background-color .15s }
.abr-zona:hover, .abr-zona:focus-visible, .abr-zona.sobre { border-color: var(--accent, #F2B705); background: var(--surface); outline: none }
.abr-zona-t { font: 700 18px/1.3 var(--f-display); color: var(--ink) }
.abr-zona-s { color: var(--ink-3); font-size: 13px; margin-top: 4px }
.abr-tipos { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 14px }
.abr-tipos span { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2) }
.abr-visor { display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.abr-cab { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 15 }
.abr-nome { display: flex; flex-direction: column; min-width: 0; flex: 1 1 200px }
.abr-nome b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.abr-nome small { color: var(--ink-3) }
.abr-acoes { display: flex; flex-wrap: wrap; align-items: center; gap: 6px }
.abr-pct { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink-2) }
.abr-ir { width: 76px; min-height: 32px }
.abr-barra-info { color: var(--ink-3); font-size: 13px; text-align: center }
.abr-nota { margin: 0; font-size: 13px }
.abr-quadro { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); min-width: 0 }
.abr-centro { display: flex; justify-content: center; align-items: flex-start; padding: 12px; overflow: auto; max-height: 80vh }
.abr-rola { overflow: auto; max-height: 80vh; padding: 12px }
.abr-erro h3 { margin-bottom: 6px }
.abr-espera { text-align: center; color: var(--ink-2) }
/* imagens, vídeo, som */
.abr-img { max-width: 100%; height: auto; display: block; background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0 / 16px 16px }
.abr-img.real { max-width: none }
.abr-video { width: 100%; max-height: 75vh; background: #000; border-radius: 4px }
.abr-som { width: min(100%, 520px); margin: 30px 0 }
/* texto e HTML */
.abr-texto { margin: 0; padding: 14px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-sm); white-space: pre-wrap; word-break: break-word;
  font: 13px/1.5 var(--f-mono, ui-monospace, monospace); max-height: 80vh; overflow: auto }
.abr-html { width: 100%; height: 78vh; border: 1px solid var(--line); border-radius: var(--r-sm); background: #fff }
/* tabelas (CSV e Excel) */
.abr-tab { border-collapse: collapse; background: #fff; color: #111; font: 13px/1.35 system-ui, sans-serif }
.abr-tab td, .abr-tab th { border: 1px solid #d9dde4; padding: 3px 6px; vertical-align: bottom; white-space: pre-wrap; max-width: 420px; overflow: hidden }
.abr-tab th { background: #eef1f6; font-weight: 600 }
.abr-xl { padding: 0 }
.abr-xl-t { table-layout: fixed }
.abr-xl-t thead th, .abr-xl-t tbody th { background: #eef1f6; color: #555; font-weight: 500; text-align: center; position: sticky; z-index: 1 }
.abr-xl-t thead th { top: 0 }
.abr-xl-t tbody th { left: 0; min-width: 40px }
.abr-xl-t col:first-child { width: 44px }
.abr-xl-t td { white-space: nowrap; text-overflow: ellipsis }
.abr-abas { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px }
.abr-aba { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: var(--r-sm) var(--r-sm) 0 0; padding: 6px 12px; font: inherit; cursor: pointer; white-space: nowrap }
.abr-aba[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.abr-aba.oculta { font-style: italic }
/* PDF */
.abr-rola-pdf { overflow: auto; max-height: 82vh; padding: 12px }
.abr-pdf { display: flex; flex-direction: column; align-items: center; gap: 12px; --abr-zoom: 1 }
.abr-pg { position: relative; width: calc(min(100%, 880px) * var(--abr-zoom)); flex: none; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .18) }
.abr-pg-c { position: absolute; inset: 0; width: 100%; height: 100% }
.abr-pg canvas ~ .abr-pg-n { display: none }
.abr-pg-n { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #bbb; font: 600 22px system-ui, sans-serif }
/* Word */
.abr-docx { background: #fff; color: #111; max-width: 820px; margin: 0 auto; padding: 48px 56px; box-shadow: 0 1px 4px rgba(0, 0, 0, .18); font: 12pt/1.5 "Times New Roman", serif }
