.abr-docx img { max-width: 100%; height: auto }
.abr-docx table { border-collapse: collapse; max-width: 100% }
.abr-docx td, .abr-docx th { border: 1px solid #999; padding: 3px 6px }
@media (max-width: 600px) { .abr-docx { padding: 22px 16px } }
/* PowerPoint */
.abr-slides { display: flex; flex-direction: column; gap: 16px; align-items: center }
.abr-slide-c { width: min(100%, 1000px); display: flex; gap: 8px; align-items: flex-start }
.abr-slide-n { color: var(--ink-3); font: 600 13px system-ui, sans-serif; min-width: 20px; text-align: right; padding-top: 4px }
.abr-slide-v { position: relative; flex: 1; overflow: hidden; box-shadow: 0 1px 4px rgba(0, 0, 0, .25); background: #fff }
.abr-slide { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; color: #000; font-family: Calibri, Carlito, Arial, sans-serif }
.abr-f { position: absolute; box-sizing: border-box }
.abr-f-img { width: 100%; height: 100%; object-fit: fill; display: block }
.abr-f-falta { display: flex; align-items: center; justify-content: center; border: 1px dashed #aaa; color: #777; font: 14px system-ui, sans-serif; background: rgba(240, 240, 240, .7) }
.abr-tx { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: visible; box-sizing: border-box }
.abr-p { margin: 0; line-height: 1.15; overflow-wrap: break-word }
.abr-ptab { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed }
.abr-ptab td, .abr-ptab th { border: 1px solid #fff; padding: 4px 8px; vertical-align: top; background: #e8ebf2 }
.abr-ptab th { background: #4472c4; color: #fff }
.abr-palco { position: fixed; inset: 0; z-index: 1000; background: #000; outline: none; cursor: pointer }
.abr-palco > .abr-slide { position: absolute }
.abr-palco-n { position: absolute; right: 14px; bottom: 10px; color: rgba(255, 255, 255, .6); font: 13px system-ui, sans-serif }
.abr-palco-x { position: absolute; right: 10px; top: 8px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .15); color: #fff; font-size: 24px; cursor: pointer }
/* ecrã inteiro e «Os meus ficheiros» */
.abr-visor.abr-cheio { position: fixed; inset: 0; z-index: 900; background: var(--bg, #f4f5f7); padding: 8px; overflow: auto; gap: 8px }
.abr-visor:fullscreen { background: var(--bg, #f4f5f7); padding: 8px; overflow: auto }

<script>/* Páginas de «Os meus documentos» (Portal CEL): calcula onde acaba cada folha (A4, A5, Carta ou Ofício, na vertical ou na horizontal),

   (para «Ver páginas» e para o PDF). Tudo neste aparelho, sem internet.

   Como funciona: uma cópia escondida do texto é posta à largura real da folha (papel menos as margens), com os tipos de letra que
   têm as medidas do Word. Daí tiram-se as linhas, uma a uma, e enchem-se as folhas como o Word: título com o parágrafo seguinte,
   pelo menos 2 linhas de cada lado quando um parágrafo passa de folha, notas de rodapé no fundo da folha onde são chamadas,
   quebras de página feitas à mão e o capítulo onde começa a numeração árabe sempre numa folha nova.
   Os resultados vêm como posições no texto (caminhos), que servem tanto na cópia como no editor.

      ov('/word/document.xml', 'document.main') + ov('/word/styles.xml', 'styles') + ov('/word/settings.xml', 'settings') + ov('/word/numbering.xml', 'numbering') + ov('/word/footnotes.xml', 'footnotes') +
      (temH ? ov('/word/header1.xml', 'header') : '') + (temF ? ov('/word/footer1.xml', 'footer') : '') +
      (temH && usaPrimeira ? ov('/word/header2.xml', 'header') : '') + (temF && usaPrimeira ? ov('/word/footer2.xml', 'footer') : '') +
      '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>';
    const raizRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>';
    const agora = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    const core = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">` +
      `<dc:title>${x(doc.titulo || 'Documento')}</dc:title><dc:creator>${x(autor || '')}</dc:creator><dc:language>${n.lingua}</dc:language><dcterms:created xsi:type="dcterms:W3CDTF">${agora}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${agora}</dcterms:modified></cp:coreProperties>`;
    const fich = [{ name: '[Content_Types].xml', data: tipos }, { name: '_rels/.rels', data: raizRels }, { name: 'docProps/core.xml', data: core },
      { name: 'word/document.xml', data: documento }, { name: 'word/styles.xml', data: estilosXml(n, larguraTw) }, { name: 'word/settings.xml', data: definicoes },
      { name: 'word/numbering.xml', data: numeracaoXml(E.listas) }, { name: 'word/footnotes.xml', data: notasXml(E.notas) }, { name: 'word/_rels/document.xml.rels', data: rels }];
    if (temH) fich.push({ name: 'word/header1.xml', data: parteHF('hdr', L.h) });
    if (temF) fich.push({ name: 'word/footer1.xml', data: parteHF('ftr', L.f) });
    if (temH && usaPrimeira) fich.push({ name: 'word/header2.xml', data: parteHF('hdr', null) });
    if (temF && usaPrimeira) fich.push({ name: 'word/footer2.xml', data: parteHF('ftr', null) });
    for (const i of E.imgs) fich.push({ name: 'word/' + i.nome, data: i.bytes });
    return DOCX.zip(fich);
  }

  /* ============================================================ PDF (imprimir): as mesmas folhas do «Ver páginas» */
  async function imprimir(c, texto) {
    const pr = document.getElementById('print-root'); if (!pr) return;
    const r = await PAGINAS.calcula(texto, c), fs = PAGINAS.folhas(r, c);
    const box = document.createElement('div'); box.className = 'esc-pgs'; box.append(...fs);
    const css = document.createElement('style'); css.id = 'esc-pagina';
    const P = PAGINAS.papel(c), mm = (v) => Math.round(v * 100) / 10;
    css.textContent = `@media print { @page { size: ${mm(P.w)}mm ${mm(P.h)}mm; margin: 0 } #print-root .esc-pg { height: ${(mm(P.h) - 0.2).toFixed(1)}mm !important } }`;
    document.getElementById('esc-pagina')?.remove();
    document.head.append(css); pr.replaceChildren(box);
    const fim = () => { pr.replaceChildren(); css.remove(); window.removeEventListener('afterprint', fim); };
    window.addEventListener('afterprint', fim);
    await Promise.all([...box.querySelectorAll('img')].map((im) => (im.complete ? 0 : new Promise((ok) => { im.onload = im.onerror = ok; }))));
    window.print();
    return r;
  }

    // recuperar uma cópia de segurança (todos os documentos) ou o ficheiro de um só documento («Guardar como»)
    async function recupera(f) {
      ficheiro.value = '';

      let j = null;
      try { j = JSON.parse(await f.text()); } catch (e) { j = null; }
      if (!j || j.tipo !== 'cel-os-meus-documentos' || !Array.isArray(j.docs)) { toast('Este ficheiro não é uma cópia de «Os meus documentos».'); return; }
      const um = j.um === true && j.docs.length === 1;        // ficheiro de um só documento («Guardar como»); uma cópia de segurança junta tudo, como antes
      let novos = 0, atual = 0, abrir = null;
      try {
        for (const d of j.docs) {
          if (!d || !d.id || typeof d.html !== 'string') continue;
          const r = inerte(d.html); limpa(r);
          const limpo = { id: String(d.id), titulo: String(d.titulo || 'Documento'), html: r.innerHTML, texto: String(d.texto || ''), conf: { ...CONF0, ...(d.conf || {}) }, modelo: d.modelo || '',
            criado: +d.criado || Date.now(), alterado: +d.alterado || Date.now(), paginas: +d.paginas || 0 };
          const ja = await Docs.um(limpo.id);
          if (!ja) { await Docs.guarda(limpo); novos++; abrir = limpo.id; }
          else if (ja.lixo) { const v = limpo.alterado >= ja.alterado ? limpo : { ...ja }; delete v.lixo; await Docs.guarda(v); novos++; abrir = v.id; }     // estava na lixeira: volta aos documentos
          else if (um && (ja.html !== limpo.html || JSON.stringify(ja.conf) !== JSON.stringify(limpo.conf) || ja.titulo !== limpo.titulo)) {
            // um só documento que já existe neste aparelho: pergunta o que fazer
            const esc2 = await pergunta('Este documento já existe', `«${ja.titulo || 'Documento'}» já está neste aparelho (alterado ${quando(ja.alterado)}). O do ficheiro foi alterado ${quando(limpo.alterado)}.`,
              [[null, 'Cancelar', 'ghost'], ['substitui', 'Substituir', 'warn'], ['copia', 'Guardar como cópia', 'primary']]);
            if (esc2 === 'copia') { const c2 = { ...limpo, id: uid('doc'), titulo: limpo.titulo + ' (cópia)' }; await Docs.guarda(c2); novos++; abrir = c2.id; }
            else if (esc2 === 'substitui') { await Docs.guarda(limpo); atual++; abrir = limpo.id; }
            else { carrega(); return; }
          } else if (!um && limpo.alterado > ja.alterado) { await Docs.guarda(limpo); atual++; }
        }

      } else toast(`Cópia recuperada: ${novos} documento(s) novo(s)${atual ? `, ${atual} atualizado(s)` : ''}.`);

      lerModelos().map((m) => h('button', { type: 'button', class: 'esc-modelo esc-meu', onclick: () => novo({ id: 'meu', titulo: 'Documento sem título', conf: m.conf, html: () => P0 }) },

    const el = h('div', { class: 'view' },
      h('div', { class: 'head' }, h('div', null, h('div', { class: 'eyebrow' }, 'Escrever'), h('h1', null, 'Os meus documentos'))),
      nota, aviso,
      h('div', { class: 'card' }, h('h2', null, 'Novo documento'), modelos),
      h('div', { class: 'card' }, h('div', { class: 'row', style: 'justify-content:space-between;margin-bottom:10px' }, h('h2', { style: 'margin:0' }, 'Os seus documentos'),
        h('div', { class: 'row' }, btn('Guardar cópia de segurança', { sm: true, onclick: copia }), btn('Recuperar cópia', { sm: true, kind: 'ghost', onclick: () => ficheiro.click(), title: 'Uma cópia de segurança ou o ficheiro de um documento («Guardar como»)' }), bLixo)),

    return { el };
  }

  /* ---------------- editor */
  function editor(id, ctx) {
    const { h, btn, toast, go, offerFile } = ctx;
    let doc = null, sujo = false, temporizador = null, vivo = true, imgSel = null, selGuardada = null;
    let pag = null, pontos = [], agendado = null, aCalcular = false, deNovo = false, paginaAtual = 0, chaveIndice = '', compondo = false, ultimoInput = 0;
    const INTERVALO = 24, BANDA = 40;          // px: espaço entre folhas (vista de páginas) e altura da faixa «Página N» (vista contínua)
    const pref = lePref();
    let vista = 'paginas';      // desde a 1.14.1 só há páginas (o «Contínuo» saiu, a pedido da Coordenação)
    let zoom = zoomValido(pref.zoom) ? String(pref.zoom) : 'ajustar';
    let foco = false, centrado = false;      // ecrã inteiro; a folha já foi centrada uma vez
    const estado = h('span', { class: 'chip esc-estado', role: 'status' }, 'A abrir…');
    const titulo = h('input', { class: 'esc-titulo', type: 'text', 'aria-label': 'Título do documento', placeholder: 'Título do documento', maxlength: '140',
      oninput: () => { if (doc) { doc.titulo = titulo.value; marca(); } } });
    const texto = h('div', { class: 'esc-texto', contenteditable: 'true', spellcheck: 'true', lang: 'pt-PT', role: 'textbox', 'aria-multiline': 'true', 'aria-label': 'Texto do documento' });
    const notasLista = h('div', { class: 'esc-notas' });
    const fundo = h('div', { class: 'esc-fundo' });          // vista de páginas: folhas brancas, números e notas de cada folha
    const folha = h('div', { class: 'esc-folha' }, fundo, texto, notasLista);
    const palcoIn = h('div', { class: 'esc-palco-in' }, folha);
    const palco = h('div', { class: 'esc-palco' }, palcoIn);
    const conta = h('span', { class: 'esc-conta' });
    const indicador = h('span', { class: 'esc-pagina-at', role: 'status' }, 'A contar as páginas…');
    const barraImg = h('div', { class: 'esc-sub', hidden: true });
    const barraTab = h('div', { class: 'esc-sub', hidden: true });

    // ----- guardar
    function marca() { sujo = true; estado.textContent = 'Por guardar…'; clearTimeout(temporizador); temporizador = setTimeout(guarda, 900); }
    async function guarda() {
      clearTimeout(temporizador); if (!doc || !sujo) return; sujo = false;
      const c = PAGINAS.tiraSaltos(texto.cloneNode(true)); c.querySelectorAll('.esc-indice').forEach((d) => d.replaceChildren()); c.querySelectorAll('.esc-sel, .esc-flash').forEach((e) => e.classList.remove('esc-sel', 'esc-flash'));
      doc.html = c.innerHTML; doc.texto = (texto.innerText || '').slice(0, 4000); doc.alterado = Date.now();
      if (pag) doc.paginas = pag.total;
      try { await Docs.guarda({ ...doc }); if (vivo && !sujo) estado.textContent = Docs.soMemoria() ? 'Só nesta sessão' : 'Guardado'; }
      catch (e) { estado.textContent = 'Não guardado'; toast('Não foi possível guardar. Descarregue em Word para não perder o texto.'); }
    }

    // ----- seleção (os botões não tiram o cursor do texto)
    const dentro = (n) => n && (n === texto || texto.contains(n));
    function guardaSel() { const s = getSelection(); if (s && s.rangeCount && dentro(s.anchorNode)) selGuardada = s.getRangeAt(0).cloneRange(); }
    function repoeSel() {
      texto.focus({ preventScroll: true });
      const s = getSelection();
      if (selGuardada && dentro(selGuardada.startContainer)) { s.removeAllRanges(); s.addRange(selGuardada); }
      else if (!s.rangeCount || !dentro(s.anchorNode)) { const r = document.createRange(); r.selectNodeContents(texto); r.collapse(false); s.removeAllRanges(); s.addRange(r); }
    }

    // ----- Desfazer e Refazer do Portal (o do navegador perdia-se com os separadores da vista de páginas)
    const hist = { pilha: [], refazer: [], cat: '', t: 0, imgs: new Map(), srcs: new Map() };

  async function lerFolha(z, livro, fl) {

    for (const row of kids(fundo(doc, 'sheetData'), 'row')) {

  /* ============================================================ PowerPoint: ler a apresentação e desenhar cada diapositivo */

<script>/* Códigos de acesso dos Recursos do Professor (CEL-RP1) — partilhado pela aplicação e pela ferramenta do coordenador.

function idbKV(k, v) {   // a mesma base de dados que o service worker lê ao acordar

    try {
      const r = indexedDB.open('cel-avisos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onerror = () => res(null);
      r.onsuccess = () => {

          q.onsuccess = () => res(q.result === undefined ? null : q.result); q.onerror = () => res(null);

}

/* ---------- juntar ao calendário do telemóvel ou do computador (.ics) */
function icsCal() {
  const pad = (n) => String(n).padStart(2, '0'), dt = (iso) => iso.replace(/-/g, '');
  const esc = (s) => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const enc = new TextEncoder();
  const fold = (l) => { const out = []; let s = l; while (enc.encode(s).length > 74) { let k = Math.min(s.length, 74); while (enc.encode(s.slice(0, k)).length > 74) k--; out.push(s.slice(0, k)); s = ' ' + s.slice(k); } out.push(s); return out.join('\r\n'); };
  const mais = (iso, n) => { const d = dOf(iso); d.setDate(d.getDate() + n); return isoDate(d); };
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//CEL Visao do Futuro//Recursos do Professor//PT', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:' + esc(`CEL — Calendário ${CAL.ano}`)];
  CAL.eventos.forEach(e => {
    const m = /^(\d{2}):(\d{2})(?:–(\d{2}):(\d{2}))?$/.exec(e.h || '');
    (e.ini ? [[e.ini, e.fim]] : e.datas.map(d => [d, d])).forEach(([a, b]) => {
      L.push('BEGIN:VEVENT', `UID:${e.id}-${dt(a)}@recursos-professor-cel`, `DTSTAMP:${stamp}`);
      if (m && a === b) L.push(`DTSTART:${dt(a)}T${m[1]}${m[2]}00`, `DTEND:${dt(a)}T${m[3] ? m[3] + m[4] : pad(Number(m[1]) + 1) + m[2]}00`);
      else L.push(`DTSTART;VALUE=DATE:${dt(a)}`, `DTEND;VALUE=DATE:${dt(mais(b, 1))}`);
      L.push('SUMMARY:' + esc(e.t), 'CATEGORIES:' + esc(evCat(e)), 'DESCRIPTION:' + esc([evCat(e), e.h, `Calendário de Atividades do CEL ${CAL.ano}`].filter(Boolean).join(' · ')));
      if (e.g !== 'alusiva' && e.g !== 'financeiro') L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc(e.t), 'TRIGGER:-P1D', 'END:VALARM');
      L.push('END:VEVENT');
    });
  });
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n') + '\r\n';
}

  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* nada */ } }
};
const K = { aparelho: 'cel-rp-aparelho', pedidos: 'cel-rp-pedidos', ativ: 'cel-rp-ativacao', verif: 'cel-rp-verificado', dia: 'cel-rp-ultimo-dia', estado: 'cel-rp-estado', consulta: 'cel-rp-ultima-consulta' };
// Portal CEL: quem escolheu ser professor(a) neste aparelho, e a sessão da gestão escolar (direção, secretaria, finanças)
const KP = { escolha: 'cel-portal-escolha', gestao: 'portal-sessao' };
const gate = $('#gate');
let installEvt = null, booted = false, pedidoAtualizar = false;

/* ---------- aparelho e datas */
function aparelho() {
  let a = LS.get(K.aparelho, null);
  if (!a || !/^[0-9A-Z]{8}$/.test(a)) { a = C.b32enc(crypto.getRandomValues(new Uint8Array(5))); LS.set(K.aparelho, a); }
  return a;
}
// o dia de hoje nunca anda para trás (atrasar o relógio do telemóvel não prolonga o acesso)
function hoje() { const d = C.hojeDias(), ult = LS.get(K.dia, 0); if (d > ult) LS.set(K.dia, d); return Math.max(d, ult); }
const pedidosDoAparelho = () => LS.get(K.pedidos, []).filter(p => p.ap === aparelho());

/* ---------- avisos */
function toast(msg) { const t = h('div', null, msg); $('#toast').append(t); setTimeout(() => t.remove(), 4200); }

/* ---------- ecrãs */
function shell(...kids) {
  document.body.classList.remove('ready'); gate.hidden = false;
  gate.replaceChildren(
    h('div', { class: 'g-top' }, h('img', { src: 'icons/emblema.jpg', alt: 'Emblema do Centro Educativo Líder', width: '68', height: '44' }),
      h('div', null, h('b', null, 'Recursos do Professor'), h('span', null, 'Centro Educativo Líder — Visão do Futuro')), botaoInstalar()),
    h('main', { class: 'g-main' }, ...kids));
  window.scrollTo(0, 0);
}
const passos = (n) => h('ol', { class: 'g-steps', 'aria-label': 'Passos' }, ['Os seus dados', 'Pedir o código', 'Ativar'].map((t, i) => h('li', { class: i + 1 === n ? 'on' : i + 1 < n ? 'ok' : null, 'aria-current': i + 1 === n ? 'step' : null }, h('span', null, String(i + 1)), t)));
const caixaAparelho = () => h('div', { class: 'g-device' }, h('span', null, 'Número deste telemóvel'), h('b', null, C.grupos(aparelho())));

function mensagem(p, canal) {
  const linha = C.linhaPedido(aparelho(), p);
  if (canal === 'sms') return `Pedido CEL de ${C.semAcentos(p.n)}: ${linha}`;
  return ['Pedido de acesso — Recursos do Professor CEL', `Nome: ${p.n}`, p.e ? `E-mail: ${p.e}` : null, p.w ? `WhatsApp: ${p.w}` : null,
    `Telemóvel: ${C.grupos(aparelho())}`, '', `Pedido: ${linha}`].filter(x => x !== null).join('\n');
}
function abrirLigacao(url, novaJanela) { const a = h('a', { href: url, target: novaJanela ? '_blank' : null, rel: 'noopener' }); document.body.append(a); a.click(); a.remove(); }
function valida(p) {
  const e = [];
  if (C.normNome(p.n).split(' ').filter(Boolean).length < 2) e.push('Escreva o nome completo (nome e apelido).');
  if (!p.e && !p.w) e.push('Indique pelo menos um contacto: e-mail ou WhatsApp. É para lá que o código vai ser enviado.');
  if (p.e && !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(p.e)) e.push('O e-mail não parece válido.');
  if (p.w && C.normTel(p.w).length < 11) e.push('O número de WhatsApp parece incompleto.');
  return e;
}
function guardaPedido(p, canal) {
  const ap = aparelho(), lista = LS.get(K.pedidos, []).filter(x => !(x.ap === ap && C.ligacao(x) === C.ligacao(p)));
  lista.unshift({ n: p.n, e: p.e, w: p.w, ap, canal, quando: new Date().toISOString() });
  LS.set(K.pedidos, lista.slice(0, 6));
}

function telaRegisto(pre = null, aviso = null) {
  const ult = pedidosDoAparelho()[0] || pre || {};
  const nome = h('input', { type: 'text', id: 'g-nome', autocomplete: 'name', value: ult.n || '', placeholder: 'Nome e apelido' });
  const email = h('input', { type: 'email', id: 'g-email', autocomplete: 'email', inputmode: 'email', value: ult.e || '', placeholder: 'nome@exemplo.com' });
  const wa = h('input', { type: 'tel', id: 'g-wa', autocomplete: 'tel', inputmode: 'tel', value: ult.w || '', placeholder: '+245 9…' });
  const err = h('div', { class: 'g-err', role: 'alert' });
  const dados = () => ({ n: nome.value.trim().replace(/\s+/g, ' '), e: email.value.trim(), w: wa.value.trim() });
  const pedir = (canal) => {
    const p = dados(), erros = valida(p);
    if (erros.length) { err.replaceChildren(...erros.map(x => h('div', null, x))); return; }
    if (canal === 'wa' && !CFG.contactos.whatsapp) { err.textContent = 'O WhatsApp da coordenação ainda não está configurado.'; return; }
    guardaPedido(p, canal);
    const msg = mensagem(p, canal);
    if (canal === 'wa') abrirLigacao(`https://wa.me/${CFG.contactos.whatsapp}?text=${encodeURIComponent(msg)}`, true);
    else if (canal === 'mail') abrirLigacao(`mailto:${CFG.contactos.email}?subject=${encodeURIComponent('Pedido de acesso — Recursos do Professor')}&body=${encodeURIComponent(msg)}`);
    else abrirLigacao(`sms:+${CFG.contactos.whatsapp}?body=${encodeURIComponent(msg)}`);
    setTimeout(() => telaAtivar(), 600);
  };
  shell(
    aviso ? h('div', { class: 'callout warn', role: 'status' }, icon('lock'), h('div', null, h('b', null, aviso.t), aviso.d)) : null,
    h('h1', null, 'Pedir acesso'),
    h('p', { class: 'muted' }, 'Esta aplicação reúne os manuais do CEL com as respostas, os planos de aula e as provas. Para a abrir precisa de um código pessoal, dado pela coordenação. O código só funciona neste telemóvel e com os seus dados.'),
    passos(1),
    h('div', { class: 'card stack' },
      h('div', { class: 'field' }, h('label', { for: 'g-nome' }, 'Nome completo'), nome),
      h('div', { class: 'field' }, h('label', { for: 'g-email' }, 'E-mail'), email),
      h('div', { class: 'field' }, h('label', { for: 'g-wa' }, 'WhatsApp'), wa, h('div', { class: 'hint' }, 'Indique pelo menos um dos dois contactos. O código chega por aí, e isso confirma que o contacto é seu.')),
      caixaAparelho(), err,
      h('div', { class: 'g-actions' },
        CFG.contactos.whatsapp ? btn('Pedir o código por WhatsApp', { kind: 'primary', icon: 'wa', onclick: () => pedir('wa') }) : null,
        CFG.contactos.email ? btn('Pedir por e-mail', { icon: 'mail', onclick: () => pedir('mail') }) : null,
        CFG.contactos.whatsapp ? btn('Pedir por SMS', { icon: 'sms', onclick: () => pedir('sms') }) : null),
      h('p', { class: 'tiny' }, 'Abre o WhatsApp, o e-mail ou as mensagens com o pedido já escrito para a coordenação do CEL. Só precisa de carregar em enviar.')),
    h('div', { class: 'g-links' }, btn('Já tenho um código', { kind: 'ghost', icon: 'key', onclick: () => {
      if (pedidosDoAparelho().length) { telaAtivar(); return; }
      const p = dados(), erros = valida(p);
      if (erros.length) { err.replaceChildren(h('div', null, 'Preencha primeiro os seus dados, iguais aos do pedido.'), ...erros.map(x => h('div', null, x))); return; }
      guardaPedido(p, 'manual'); telaAtivar();
    } })),
    h('div', { class: 'g-links' }, btn('É da direção, da secretaria ou das finanças?', { kind: 'ghost', icon: 'pasta', onclick: () => { LS.del(KP.escolha); location.href = 'gestao.html'; } })),
    ligCoord());
}

/* Portal CEL: a primeira escolha, para quem ainda não usa nenhum dos ambientes neste aparelho */
/* ---------- a Coordenação Geral entra com o e-mail e a palavra-passe da gestão escolar (sem código)
   A chave do ano fica fechada no Supabase (Portal_CEL_1.13.0.sql): só uma conta ativa com o papel «coordenacao» lhe chega.
   Com ela, o Portal faz aqui mesmo um código para este aparelho, até ao fim do ano letivo; a palavra-passe não fica guardada. */
const ligCoord = () => (CFG.sb && CFG.anon ? h('div', { class: 'g-links' }, btn('Coordenação: entrar com e-mail e palavra-passe', { kind: 'ghost', icon: 'lock', onclick: () => telaCoord() })) : null);
async function sb(caminho, corpo, tk) {
  let r;
  try {
    r = await fetch(CFG.sb + caminho, { method: 'POST', cache: 'no-store', headers: Object.assign({ apikey: CFG.anon, 'Content-Type': 'application/json' }, tk ? { Authorization: 'Bearer ' + tk } : {}), body: JSON.stringify(corpo || {}) });
  } catch (e) { const x = new Error('Sem ligação à internet. Para entrar com o e-mail e a palavra-passe precisa de internet (só desta vez).'); x.rede = true; throw x; }
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { /* nada */ }
  if (!r.ok) { const x = new Error((j && (j.msg || j.message || j.error_description)) || String(r.status)); x.status = r.status; x.cod = j && (j.code || j.error_code); throw x; }
  return j;
}
function telaCoord(msgErro = '') {
  let pre = ''; try { const s = JSON.parse(localStorage.getItem(KP.gestao) || 'null'); pre = (s && s.user && s.user.email) || ''; } catch (e) { /* nada */ }
  const email = h('input', { type: 'email', id: 'g-cemail', autocomplete: 'username', inputmode: 'email', value: pre, placeholder: 'nome@exemplo.com' });
  const pw = h('input', { type: 'password', id: 'g-cpw', autocomplete: 'current-password', placeholder: 'A sua palavra-passe' });
  const err = h('div', { class: 'g-err', role: 'alert' }, msgErro);
  const ok = btn('Entrar', { kind: 'primary', icon: 'key' });
  const entra = async () => {
    const e = email.value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(e) || !pw.value) { err.textContent = 'Escreva o e-mail e a palavra-passe da sua conta da gestão escolar.'; return; }
    ok.disabled = true; err.textContent = 'A entrar…';
    try {
      let s;
      try { s = await sb('/auth/v1/token?grant_type=password', { email: e, password: pw.value }); }
      catch (x) { if (x.rede) throw x; throw new Error('O e-mail ou a palavra-passe não estão certos.'); }
      let chave;
      try { chave = await sb('/rest/v1/rpc/portal_chave_recursos', {}, s.access_token); }
      catch (x) {
        if (x.rede) throw x;
        if (x.status === 404) throw new Error('A entrada da coordenação ainda não está preparada no servidor (falta o ficheiro Portal_CEL_1.13.0.sql).');
        throw new Error('Esta conta não é da Coordenação Geral. Os outros professores entram com o código pessoal.');
      }
      if (!chave) throw new Error('A chave do ano ainda não foi guardada. Abra a Gestão escolar → Acessos → «Recursos do Professor sem código» e cole lá a chave do ano.');
      const k = (C.b32dec(String(chave)) || new Uint8Array()).slice(0, 12);
      const ano = String(CFG.ano || '').match(/(\d{4})\D*$/), validade = `${ano ? ano[1] : new Date().getFullYear() + 1}-07-31`;
      const p = { n: 'Coordenação Geral', e, w: '' };
      const codigo = k.length === 12 ? await C.gera(k, aparelho(), validade, p) : '';
      const r = codigo && await C.abre(codigo, aparelho(), p, CFG.verificador);
      if (!r) throw new Error(`A chave guardada no servidor não é a deste ano letivo (${CFG.ano}). Na Gestão escolar → Acessos, cole a chave nova.`);
      if (r.dias < hoje()) throw new Error('O ano letivo desta chave já terminou. Na Gestão escolar → Acessos, cole a chave do ano novo.');
      pw.value = '';
      LS.set(K.ativ, { codigo, p, dias: r.dias, ativado: new Date().toISOString(), versao: CFG.versao, coord: true });
      LS.set(K.verif, hoje()); LS.del(K.estado);
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (x) { /* opcional */ }
      await abrirApp(LS.get(K.ativ, null), r.key);
      toast('Bem-vindo, Coordenação Geral.');
    } catch (x) { err.textContent = x.message || 'Não foi possível entrar. Tente outra vez.'; }
    finally { ok.disabled = false; }
  };
  ok.addEventListener('click', entra);
  pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') entra(); });
  shell(
    h('h1', null, 'Entrada da Coordenação'),
    h('p', { class: 'muted' }, 'Entre com o e-mail e a palavra-passe da sua conta da gestão escolar. Não precisa de código: o acesso fica neste aparelho até ao fim do ano letivo. Só as contas da Coordenação Geral entram assim.'),
    h('div', { class: 'card stack' },
      h('div', { class: 'field' }, h('label', { for: 'g-cemail' }, 'E-mail'), email),
      h('div', { class: 'field' }, h('label', { for: 'g-cpw' }, 'Palavra-passe'), pw),
      err, h('div', { class: 'g-actions' }, ok)),
    h('div', { class: 'g-links' }, btn('Voltar', { kind: 'ghost', onclick: () => inicio() })));
  setTimeout(() => (pre ? pw : email).focus(), 50);
}

function telaEntrada() {
  const op = (ic, t, d, f) => h('button', { type: 'button', class: 'g-op', onclick: f }, h('span', { class: 'g-op-ic', 'aria-hidden': 'true' }, icon(ic)), h('span', null, h('b', null, t), h('small', null, d)));
  shell(
    h('h1', null, 'Portal CEL'),
    h('p', { class: 'muted' }, 'O Portal reúne os Recursos do Professor, a gestão escolar e o CEL Conecta. Escolha o seu ambiente.'),
    h('div', { class: 'g-escolha' },
      op('livro', 'Professor(a)', 'Manuais, planos de aula, provas, calendário e formações', () => { LS.set(KP.escolha, 'prof'); telaRegisto(); }),
      op('pasta', 'Direção, secretaria e finanças', 'Gestão escolar: matrículas, recibos, pessoal e documentos', () => { location.href = 'gestao.html'; }),
      op('conecta', 'CEL Conecta', 'Conversas, mural e avisos da escola, para toda a comunidade, também os encarregados', () => { location.href = 'conecta/'; })),
    ligCoord());
  const b = $('.g-top b'); if (b) b.textContent = 'Portal CEL';
}

function telaAtivar(msgErro = '') {
  const ps = pedidosDoAparelho(), p = ps[0];
  if (!p) { telaRegisto(); return; }
  const cod = h('input', { type: 'text', id: 'g-cod', class: 'g-code', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', placeholder: 'XXXX-XXXX-XXXX-XXXX-XXXX-XXXX', 'aria-describedby': 'g-cod-ajuda' });
  const err = h('div', { class: 'g-err', role: 'alert' }, msgErro);
  const ok = btn('Ativar', { kind: 'primary', icon: 'key' });
  const tentar = async () => {
    const s = C.limpa(cod.value);
    if (s.length !== C.TAM) { err.textContent = s.length ? `O código tem ${C.TAM} letras e números; este tem ${s.length}. Confirme que o copiou inteiro.` : 'Escreva ou cole o código que recebeu.'; return; }
    ok.disabled = true; err.textContent = '';
    try {
      let achou = null;
      for (const x of ps) { const r = await C.abre(s, aparelho(), x, CFG.verificador); if (r) { achou = { r, p: x }; break; } }
      if (!achou) { err.textContent = 'Este código não serve para este telemóvel ou para estes dados. Confirme que o copiou inteiro; se continuar, peça um código novo.'; return; }
      if (achou.r.dias < hoje()) { err.textContent = `Este código já passou da validade (${C.dataPT(achou.r.dias)}). Peça um código novo.`; return; }
      LS.set(K.ativ, { codigo: s, p: { n: achou.p.n, e: achou.p.e, w: achou.p.w }, dias: achou.r.dias, ativado: new Date().toISOString(), versao: CFG.versao });
      LS.set(K.verif, hoje()); LS.del(K.estado);
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* opcional */ }
      await abrirApp(LS.get(K.ativ, null), achou.r.key);
      toast('Acesso ativado. Bem-vindo(a)!');
      consulta();
    } finally { ok.disabled = false; }
  };
  ok.addEventListener('click', tentar);
  cod.addEventListener('keydown', (e) => { if (e.key === 'Enter') tentar(); });
  cod.addEventListener('input', () => { const s = C.limpa(cod.value).slice(0, C.TAM); const f = C.grupos(s); if (f !== cod.value) cod.value = f; });
  const colar = navigator.clipboard && navigator.clipboard.readText ? btn('Colar', { icon: 'paste', onclick: async () => { try { cod.value = C.grupos(C.limpa(await navigator.clipboard.readText()).slice(0, C.TAM)); cod.focus(); } catch (e) { cod.focus(); toast('Toque no campo e use «Colar» do teclado.'); } } }) : null;
  const quando = p.quando ? new Date(p.quando).toLocaleDateString('pt-PT') : '';
  shell(
    h('h1', null, 'Ativar com o código'),
    passos(3),
    h('div', { class: 'card stack' },
      h('p', null, p.canal && p.canal !== 'manual' ? `Pedido enviado ${p.canal === 'wa' ? 'por WhatsApp' : p.canal === 'mail' ? 'por e-mail' : 'por SMS'}${quando ? ' em ' + quando : ''}. Quando a coordenação responder, copie o código e cole-o aqui.` : 'Escreva ou cole o código que recebeu da coordenação.'),
      h('dl', { class: 'kv' }, h('dt', null, 'Nome'), h('dd', null, p.n), p.e ? [h('dt', null, 'E-mail'), h('dd', null, p.e)] : null, p.w ? [h('dt', null, 'WhatsApp'), h('dd', null, p.w)] : null,
        h('dt', null, 'Telemóvel'), h('dd', { class: 'mono' }, C.grupos(aparelho()))),
      h('div', { class: 'field' }, h('label', { for: 'g-cod' }, 'Código de acesso'), cod, h('div', { class: 'hint', id: 'g-cod-ajuda' }, `${C.TAM} letras e números. Os traços não contam.`)),
      err, h('div', { class: 'g-actions' }, ok, colar)),
    h('div', { class: 'g-links' }, btn('Mudar os dados ou pedir de novo', { kind: 'ghost', onclick: () => telaRegisto() })),
    ligCoord());
  setTimeout(() => cod.focus(), 50);
}

function telaBloqueio(tipo) {

  const T = {
    suspenso: ['Acesso suspenso', 'A coordenação do CEL suspendeu o acesso deste telemóvel. Fale com a coordenação; quando o acesso for reposto, carregue em «Verificar outra vez», com internet.'],
    retirado: ['Acesso retirado', 'A coordenação do CEL retirou o acesso deste telemóvel. Se precisar de voltar a usar a aplicação, peça um código novo.'],
    expirado: ['O acesso terminou', `O seu código era válido até ${act ? C.dataPT(act.dias) : 'ao fim do ano letivo'}. Peça um código novo à coordenação.`],
    verificar: ['Confirmar o acesso', `A aplicação confirma o acesso pelo menos de ${CFG.diasSemLigacao} em ${CFG.diasSemLigacao} dias. Ligue a internet um momento e carregue em «Verificar agora». Gasta muito pouco.`],
    novo: ['O seu código já não serve', 'Os manuais foram renovados para um novo ano letivo. Peça um código novo à coordenação.']
  }[tipo];

  } });

    out, ult ? h('p', { class: 'tiny' }, `${ult.n} · telemóvel ${C.grupos(aparelho())}`) : null,
    tipo !== 'suspenso' && tipo !== 'retirado' ? ligCoord() : null);
}

function telaAbrir() { shell(h('div', { class: 'g-wait' }, h('div', { class: 'g-spin', 'aria-hidden': 'true' }), h('p', null, 'A abrir os manuais…'))); }
function telaErro(t, d) { shell(h('div', { class: 'g-lock' }, icon('lock')), h('h1', null, t), h('p', null, d)); }

/* ---------- dados cifrados */
async function carregaDados(key) {
  const r = await fetch(CFG.dados);
  if (!r.ok) throw new Error('dados ' + r.status);
  const gz = await C.decifra(key, new Uint8Array(await r.arrayBuffer()));
  const txt = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}
async function abrirApp(act, key) {
  if (booted) { gate.hidden = true; gate.replaceChildren(); document.body.classList.add('ready'); barra(); return true; }
  telaAbrir();
  if (!key) { const r = await C.abre(act.codigo, aparelho(), act.p, CFG.verificador); if (!r) { telaBloqueio('novo'); return false; } key = r.key; }
  let dados;
  try { dados = await carregaDados(key); }
  catch (e) { telaErro('Não foi possível abrir os manuais', 'Feche a aplicação e abra-a outra vez. Se a aplicação ainda não terminou de se instalar, abra-a uma vez com internet.'); return false; }
  window.__CEL_DATA = dados;
  // decifra também as formações publicadas pela coordenação (a chave fica só aqui, na memória)
  window.__CEL_PWA = { nome: act.p.n, aparelho: C.grupos(aparelho()), validade: C.dataPT(act.dias), versao: CFG.versao, verificar: verificarAgora, decifra: (b) => C.decifra(key, b) };
  gate.hidden = true; gate.replaceChildren(); document.body.classList.add('ready');
  if (!booted) { booted = true; window.CEL_BOOT(); }
  barra();
  return true;
}

/* ---------- lista de acessos suspensos e retirados (publicada pela coordenação) */
async function lista(timeout = 9000) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), timeout);
  try { const r = await fetch('acessos.json?t=' + Date.now(), { cache: 'no-store', signal: ctl.signal }); if (!r.ok) return null; return await r.json(); }
  catch (e) { return null; } finally { clearTimeout(t); }
}
async function consulta(forcar = false) {
  const act = LS.get(K.ativ, null); if (!act) return null;
  if (!forcar && navigator.onLine === false) return null;
  const j = await lista(); if (!j) return null;
  LS.set(K.consulta, Date.now());
  const fp = await C.impressao(act.codigo);
  if ((j.retirados || []).includes(fp)) { LS.del(K.ativ); LS.set(K.estado, 'retirado'); telaBloqueio('retirado'); return 'retirado'; }
  if ((j.suspensos || []).includes(fp)) { LS.set(K.estado, 'suspenso'); telaBloqueio('suspenso'); return 'suspenso'; }
  LS.set(K.verif, hoje()); if (LS.get(K.estado, null)) LS.del(K.estado);
  return 'ok';
}
async function verificarAgora() {
  toast('A procurar atualizações…');
  const reg = window.__celReg;
  try { if (reg) await reg.update(); } catch (e) { /* sem rede */ }
  const r = await consulta(true);
  if (r === null) toast('Sem internet de momento. Tente mais tarde.');
  else if (r === 'ok') toast(reg && reg.waiting ? 'Há uma versão nova: toque em «Atualizar» em baixo.' : 'Está tudo em dia.');
}

/* ---------- instalar no ecrã do telemóvel
   Na primeira vez que a página abre fora da aplicação instalada, pede para instalar. Se a pessoa recusar, o botão «Instalar»
   fica no cimo da página (antes e depois de ativar) e só desaparece quando a aplicação estiver instalada. */
const KI = { pedido: 'cel-rp-pedido-instalar', instalada: 'cel-rp-instalada' };
const emApp = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
// aberta pelo ícone, ou já instalada neste telemóvel (o Chrome só avisa «beforeinstallprompt» quando ainda não está)
const instalada = () => emApp() || LS.get(KI.instalada, false) === true;
const iOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let dlg = null;
function botaoInstalar() {
  return h('button', { type: 'button', class: 'b-instalar', hidden: instalada(), 'aria-haspopup': 'dialog', onclick: pedirInstalar }, icon('dl'), 'Instalar');
}
function pintaInstalar() {
  const inst = instalada();
  document.querySelectorAll('.b-instalar').forEach((b) => { b.hidden = inst; });
  if (dlg && dlg.open) { if (inst) dlg.close(); else conteudoDialogo(); }
}
function conteudoDialogo() {
  const manual = iOS
    ? ['Toque em Partilhar (o quadrado com a seta para cima), em baixo no Safari.', 'Toque em «Adicionar ao ecrã principal» e depois em «Adicionar».']
    : ['No Chrome, toque em ⋮ (em cima, à direita).', 'Toque em «Instalar app» ou em «Adicionar ao ecrã principal» e depois em «Instalar».'];
  dlg.firstChild.replaceChildren(...[
    h('div', { class: 'i-cab' }, h('img', { src: 'icons/icon-192.png', alt: '', width: '56', height: '56' }),
      h('div', null, h('h2', { id: 'i-tit' }, 'Instalar no telemóvel'), h('p', null, 'Portal CEL'))),
    h('p', null, 'Com a aplicação no ecrã do telemóvel, os manuais abrem com um toque, como as outras aplicações, mesmo sem internet.'),
    installEvt ? null : h('ol', { class: 'i-passos' }, manual.map((t) => h('li', null, t))),
    h('div', { class: 'g-actions' },
      installEvt ? btn('Instalar', { kind: 'primary', icon: 'dl', onclick: () => { dlg.close(); pedirInstalar(); } }) : null,
      btn(installEvt ? 'Agora não' : 'Fechar', { kind: installEvt ? 'ghost' : 'primary', onclick: () => dlg.close() })),
    h('p', { class: 'i-nota' }, 'Se não instalar agora, o botão «Instalar» fica no cimo da página.')].filter(Boolean));
}
function abreDialogo() {
  if (instalada()) { pintaInstalar(); return; }
  if (!dlg) {
    dlg = h('dialog', { class: 'i-dlg', 'aria-labelledby': 'i-tit' }, h('div', { class: 'i-in' }));
    dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });   // tocar fora do quadro fecha
    document.body.append(dlg);
  }
  conteudoDialogo();
  if (!dlg.open) { try { dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); } }
}
async function pedirInstalar() {
  if (instalada()) { pintaInstalar(); return; }
  if (!installEvt) { abreDialogo(); return; }   // o Chrome ainda não deixa instalar com um toque: mostra o caminho pelo menu
  const ev = installEvt; installEvt = null;     // cada pedido do Chrome só serve uma vez
  try { ev.prompt(); await ev.userChoice; } catch (e) { /* nada */ }
  pintaInstalar();                              // se recusou, o botão fica; se instalou, o «appinstalled» esconde-o
}
function talvezPedirInstalacao() {
  if (!LS.ok || instalada() || LS.get(KI.pedido, false)) return;
  setTimeout(() => {
    if (instalada() || LS.get(KI.pedido, false)) return;
    if (!gate.hidden && $('.g-lock', gate)) return;   // ecrã de bloqueio ou de erro: não é altura de pedir
    LS.set(KI.pedido, new Date().toISOString());
    abreDialogo();
  }, 1500);
}
if (emApp()) LS.set(KI.instalada, true);
LS.del('cel-rp-sem-instalar');   // o «Agora não» antigo escondia o aviso para sempre; agora o botão fica até instalar
{ const topo = $('.top-in'); if (topo) topo.append(botaoInstalar()); }
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; LS.del(KI.instalada); pintaInstalar(); });
window.addEventListener('appinstalled', () => {
  installEvt = null; LS.set(KI.instalada, true); pintaInstalar();
  toast('Aplicação instalada. Abra-a pelo ícone «Portal CEL» no ecrã do telemóvel.');
});

/* ---------- atualizar */
let novaVersao = null;
function barra() {
  const b = $('#barra'); if (!b) return;
  if (!document.body.classList.contains('ready')) { b.hidden = true; return; }
  if (novaVersao) {
    b.hidden = false;
    b.replaceChildren(h('span', null, 'Há uma versão nova do Portal CEL.'), btn('Atualizar', { kind: 'primary', icon: 'refresh', onclick: () => { pedidoAtualizar = true; novaVersao.postMessage('ATUALIZAR'); } }));
  } else b.hidden = true;
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  navigator.serviceWorker.register('sw.js').then((reg) => {
    window.__celReg = reg;
    const ve = (w) => { if (!w) return; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) { novaVersao = w; barra(); } }); };
    if (reg.waiting && navigator.serviceWorker.controller) { novaVersao = reg.waiting; barra(); }
    ve(reg.installing);   // uma versão nova que já se estava a instalar quando a página abriu
    reg.addEventListener('updatefound', () => ve(reg.installing));
    if (navigator.onLine !== false) reg.update().catch(() => {});
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (pedidoAtualizar) { pedidoAtualizar = false; location.reload(); } });
}
// com a aplicação aberta: verificar o acesso quando volta a haver rede ou quando se volta à aplicação (no máximo de 6 em 6 horas)
const talvezConsultar = () => { if (!LS.get(K.ativ, null) || !booted) return; if (Date.now() - LS.get(K.consulta, 0) > 6 * 3600e3) consulta(); };
window.addEventListener('online', talvezConsultar);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') talvezConsultar(); });

/* ---------- arranque */
async function inicio() {
  if (!LS.ok) { telaErro('Este navegador não deixa guardar dados', 'Abra a aplicação no Chrome, fora do modo anónimo.'); return; }
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') { telaErro('Abra a aplicação no Chrome', 'Este navegador não consegue abrir os manuais protegidos. Use o Chrome atualizado e o endereço da aplicação (https).'); return; }
  const dia = hoje(), act = LS.get(K.ativ, null), estado = LS.get(K.estado, null);
  if (!act) {
    if (estado === 'retirado') { telaBloqueio('retirado'); return; }
    if (pedidosDoAparelho().length) { telaAtivar(); return; }
    const prof = /[?&]professor\b/.test(location.search) || LS.get(KP.escolha, '') === 'prof';
    if (!prof && LS.get(KP.gestao, null)) { location.replace('gestao.html'); return; }   // aparelho da direção ou da secretaria
    if (prof) telaRegisto(); else telaEntrada();
    return;
  }
  if (estado === 'suspenso') { telaBloqueio('suspenso'); if ((await consulta()) === 'ok') inicio(); return; }
  if (act.dias < dia) { telaBloqueio('expirado'); return; }
  if (dia - LS.get(K.verif, 0) > CFG.diasSemLigacao) { telaBloqueio('verificar'); if ((await consulta()) === 'ok') inicio(); return; }
  if (await abrirApp(act)) consulta();
}
inicio();
talvezPedirInstalacao();
})();
</script>
